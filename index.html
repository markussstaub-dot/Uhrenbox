      <div class="actions"><button class="btn${blob ? '' : ' primary'}" data-act="wc-cam">📷 ${blob ? 'Neues Foto' : 'Foto machen'}</button><button class="btn ghost" data-act="wc-gal">Aus Galerie</button>${blob ? '<button class="btn ghost" data-act="wc-nophoto">Ohne Foto</button>' : ''}</div>
      <div class="label">${blob ? 'Welche Uhr ist das? Antippen zum Eintragen' : 'Welche Uhr trägst du heute?'}</div>
      ${list.length ? `<div class="sugg">${list.map(item).join('')}</div>` : '<p class="muted" style="margin:0">Noch keine Uhren in der Sammlung.</p>'}
      <p class="muted" style="margin:0;font-size:12px">Die Reihenfolge kommt aus deinem Tragemuster (gestern, Wochentag, lange nicht getragen). Das Foto wird nicht ausgewertet, es bleibt nur als Erinnerung beim Tag.</p>
    </div>`;
  }

  // ----- Vergleich -----
  function renderCompare() {
    const all = [...S.watches].sort(byNr);
    if (!S.cmpSel) S.cmpSel = all.map(w => w.id);
    const ws = all.filter(w => S.cmpSel.includes(w.id));
    const numRows = [['diameter', 'Durchmesser', 'mm'], ['lugToLug', 'Lug-to-Lug', 'mm'], ['height', 'Höhe', 'mm'], ['lugWidth', 'Bandanstoß', 'mm'], ['waterM', 'Wasserdicht', 'm'], ['price', 'Kaufpreis', '€']];
    const txtRows = [['movement', 'Werk'], ['movementKind', 'Art'], ['homage', 'Vorbild'], ['crystal', 'Glas'], ['strap', 'Band']];
    const wearN = id => wearDaysOf(id).length;
    const numRow = ([k, l, u]) => {
      const vals = ws.map(w => typeof w[k] === 'number' ? w[k] : null); const known = vals.filter(v => v != null);
      const mx = Math.max(...known, 0), mn = Math.min(...known);
      return `<tr><td class="label" style="white-space:nowrap">${l}</td>${ws.map((w, i) => { const v = vals[i]; return `<td class="mono ${v != null && known.length > 1 && (v === mx || v === mn) ? 'hi' : ''}">${v != null ? nf(v, 2) + ' ' + u : '<span class="muted">offen</span>'}${v != null && mx ? `<div class="mini"><span style="width:${v / mx * 100}%"></span></div>` : ''}</td>`; }).join('')}</tr>`;
    };
    return `
      <div class="view-head"><div><h2>Vergleich</h2><p>Maße und Werke nebeneinander. Fett: größter und kleinster Wert der Zeile.</p></div></div>
      <div class="chips" style="margin-bottom:16px">${all.map(w => `<button class="chip" data-cmp="${esc(w.id)}" aria-pressed="${S.cmpSel.includes(w.id)}"><span class="dot" style="background:${esc(w.color || 'var(--muted)')};margin-right:5px"></span>${esc(w.name)}</button>`).join('')}</div>
      ${ws.length ? `<div class="tbl-wrap"><table class="cmp">
        <thead><tr><th>Merkmal</th>${ws.map(w => `<th><span class="label">Uhr ${w.nr ?? ''}</span><a class="t" href="#uhr-${esc(w.id)}" data-open="${esc(w.id)}">${esc(w.name)}</a></th>`).join('')}</tr></thead>
        <tbody>${numRows.map(numRow).join('')}
          ${txtRows.map(([k, l]) => `<tr><td class="label" style="white-space:nowrap">${l}</td>${ws.map(w => `<td>${w[k] ? esc(w[k]) : '<span class="muted">offen</span>'}</td>`).join('')}</tr>`).join('')}
          <tr><td class="label">Tragetage</td>${ws.map(w => `<td class="mono">${wearN(w.id)}</td>`).join('')}</tr>
          <tr><td class="label">Letzter Gang</td>${ws.map(w => { const m = S.measurements.filter(x => x.watchId === w.id).sort((a, b) => String(b.at).localeCompare(String(a.at)))[0]; const v = m ? mValue(m, w) : null; return `<td class="mono state-${tolState(v, w)}">${v != null ? signed(v) + ' ' + esc(unitOf(m, w)) : '<span class="muted">–</span>'}</td>`; }).join('')}</tr>
        </tbody></table></div>` : '<div class="empty">Wähle oben mindestens eine Uhr.</div>'}
    `;
  }

  // ---------- Zeitwaage: Gang per Mikrofon (SPEC-zeitwaage.md, M2) ----------
  // Vollbild-Fenster über dem Messungs-Formular. Die Auswertung (zeitwaage.js) wird erst hier geladen.
  // Ablauf: Mikrofon → AudioWorklet → Ringpuffer (2 min) → alle 2 s die letzten 20 s (Quarz: 120 s) auswerten.
  // Testschalter für den Browser am PC: ?zwtest=<WAV-Pfad> spielt eine Aufnahme statt des Mikrofons ein.
  const POSITIONS = ['Zifferblatt oben', 'Zifferblatt unten', 'Krone unten', 'Krone oben', 'Krone links', 'Krone rechts', 'Am Handgelenk'];
  const ZW_KEY = 'uhrenbox.zeitwaage';   // Geräte-Einstellungen (nicht in der Sicherung): { calibPpm }
  const medianOf = a => { const s = a.filter(v => v != null && isFinite(v)).sort((x, y) => x - y); return s.length ? s[s.length >> 1] : null; };
  const deN = (v, d = 1) => v == null ? '–' : Number(v).toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
  const sgn = (v, d = 1) => v == null ? '–' : (v >= 0 ? '+' : '−') + deN(Math.abs(v), d);
  const bphTxt = b => b === 3600 ? 'Quarz (1 Tick/s)' : b === 14400 ? 'Quarz (4 Schritte/s)' : `${nf(b, 0)} A/h`;

  // Frequenz aus der Uhr, Rangfolge laut Spec: von Hand (Erweitert) → A/h an der Uhr → Kaliber → Werk-Art → erkennen
  function zwFreq(z) {
    const w = z.w;
    if (z.manual) return { bph: z.manual, how: 'von Hand gewählt' };
    // Das Kaliber sagt, welche Ticks wie oft kommen sollten. Quarz wird nicht akustisch gemessen: Der Gang ist kleiner
    // als das, was das Handymikrofon in Minuten auflöst, und viele Werke sind nicht hörbar (VK63, VH31 kaum).
    const k = z.lib.kaliber(w?.movement);
    if (isQuarzWerk(w) || (k && !['Automatik', 'Handaufzug'].includes(k.art))) return { quarz: true, how: k ? `Kaliber ${k.name}` : `Werk-Art ${w.movementKind || 'Quarz'}` };
    if (w?.bph) return { bph: w.bph, how: 'an der Uhr eingetragen', check: true };
    if (k?.bph) return { bph: k.bph, how: `Kaliber ${k.name}`, check: true };
    if (isMech(w)) return { bph: null, nurMech: true, how: 'mechanisch, wird erkannt' };
    return { bph: null, how: 'wird erkannt' };
  }

  const quarzHinweis = speichern => `<p class="notice warn" style="margin:0">Quarzuhr: Ihr Gang ist kleiner als das, was das Handymikrofon in Minuten auflöst, und viele Quarzwerke sind gar nicht hörbar. Genauer ist der <b>Abgleich mit Funkuhr</b> über einige Wochen. <button class="btn small" data-act="zw-to-vergleich">Zum Abgleich wechseln</button>${speichern ? ' <button class="btn small" data-act="zw-save-bph" data-bph="3600">Als Quarzwerk speichern</button>' : ''}</p>`;
  // Messungs-Formular auf „Abgleich mit Funkuhr“ umstellen, Uhr und Zeitpunkt bleiben
  function mToVergleich() {
    const el = document.querySelector('form[data-form="measure"]')?.elements; if (!el) return;
    S.mEditing = { ...S.mEditing, watchId: el.watchId.value, kind: 'vergleich', at: el.at.value }; render();
  }

  async function openZw(form) {
    const w = W(form.elements.watchId.value);
    let lib;
    try { lib = S.zwLib ||= await import('./zeitwaage.js'); }
    catch (er) { console.error(er); return toast('Zeitwaage konnte nicht geladen werden. Einmal mit Netz öffnen, dann geht sie offline.'); }
    let calib = 0; try { calib = Number(JSON.parse(localStorage.getItem(ZW_KEY))?.calibPpm) || 0; } catch (e) {}
    S.zw = { w, lib, pos: form.elements.position?.value || POSITIONS[0], calib, manual: null, devId: null, devs: [], run: null,
      gute: [], hoer: [], unruhig: 0, lang: false, last: null, msg: '', saved: false };
    if (zwFreq(S.zw).quarz) S.zw.msg = quarzHinweis(false);
    document.body.style.overflow = 'hidden';
    renderZw();
  }
  function closeZw() { zwStop(); S.zw = null; document.body.style.overflow = ''; renderZw(); }

  function renderZw() {
    const el = document.getElementById('zw'), z = S.zw;
    el.hidden = !z; if (!z) { el.innerHTML = ''; return; }
    const f = zwFreq(z), opt = (v, l, s) => `<option value="${v}" ${s ? 'selected' : ''}>${l}</option>`;
    el.innerHTML = `<div class="in">
      <div class="head"><h2>Zeitwaage</h2><button class="btn ghost" data-act="zw-close" aria-label="Schließen">✕</button></div>
      <p class="muted" style="margin:0">${esc(watchLabel(z.w))} · Frequenz <span id="zw-fq">${f.bph ? bphTxt(f.bph) + ', ' : ''}${esc(f.how)}</span></p>
      <div class="field"><label for="zw-pos">Lage</label><select id="zw-pos">${POSITIONS.map(p => opt(esc(p), esc(p), p === z.pos)).join('')}</select></div>
      <p class="notice" style="margin:0">Uhr mit dem Boden aufs Mikrofon legen (unten am Handy), weiche Unterlage, stiller Raum. Die ersten 2 s nach dem Auflegen zählen nicht.</p>
      <div class="actions"><button class="btn primary" data-act="zw-go" id="zw-go"></button><span id="zw-status" class="muted" role="status" style="font-size:13.5px"></span></div>
      <div id="zw-msg"></div>
      <div class="vals" id="zw-vals"></div>
      <canvas id="zw-strip" aria-label="Zeitwaagen-Streifen: Abstand jedes Ticks zum Soll-Raster, Steigung = Gang"></canvas>
      <details><summary>Erweitert</summary><div class="grid-form" style="margin-top:8px">
        <div class="field"><label for="zw-bph">Frequenz</label><select id="zw-bph">${opt('', 'aus der Uhr', !z.manual)}${z.lib.FREQUENZEN.map(b => opt(b, bphTxt(b), z.manual === b)).join('')}</select></div>
        ${z.devs.length > 1 ? `<div class="field"><label for="zw-dev">Mikrofon</label><select id="zw-dev">${z.devs.map(d => opt(esc(d.deviceId), esc(d.label || 'Mikrofon'), d.deviceId === z.devId)).join('')}</select></div>` : ''}
        <p class="muted field wide" style="margin:0;font-size:12.5px">Handy-Takt ${z.calib ? `kalibriert: ${sgn(z.calib, 0)} ppm` : 'nicht kalibriert: Fehler bis ±1–4 s/Tag möglich (am Fold6 gemessen: ±1 ppm ≈ 0,1 s/Tag)'}.</p>
        <div class="field wide"><button type="button" class="btn small" data-act="zw-wav" id="zw-wav">Aufnahme speichern (WAV, letzte bis zu 2 min)</button></div>
      </div></details>
      <div class="foot"><button class="btn primary" data-act="zw-take" id="zw-take">Übernehmen</button><button class="btn" data-act="zw-close">Abbrechen</button></div>
    </div>`;
    zwShow();
  }

  // nur die Live-Teile neu zeichnen (Auswahlfelder bleiben, wie sie sind)
  function zwShow(status) {
    const z = S.zw; if (!z) return;
    const $ = id => document.getElementById(id), r = z.last, g = z.gute;
    if (status != null) $('zw-status').textContent = status;
    $('zw-go').textContent = z.run ? 'Stoppen' : z.last ? 'Neu starten' : 'Messung starten';
    $('zw-take').disabled = !g.length;
    $('zw-wav').disabled = !(z.run || z.rest)?.gesamt;
    $('zw-msg').innerHTML = z.msg;
    const box = (wert, text, cls = '') => `<div class="val ${cls}"><b>${wert}</b><span>${text}</span></div>`;
    const ruhig = g.length >= 3 ? medianOf(g.map(x => x.gang)) : null, quarz = r?.bph === 3600;
    let html = box(ruhig != null ? sgn(ruhig) : '–', `s/Tag ruhiger Wert${g.length >= 3 ? ` (Median der letzten ${g.length} guten Messungen)` : ', nach 3 guten Messungen'}`, 'big');
    if (r && !r.fehler) {
      const bad = z.lib.unsicher(r);
      html += box(sgn(r.gang), `s/Tag Gang, letzte Messung${bad ? ' · zählt nicht' : r.vorlaeufig ? ' · vorläufig, zählt ab 2 min' : ''}`, bad || r.vorlaeufig ? 'off' : '')
        + box(quarz ? '–' : deN(r.abfall, 2), 'ms Abfallfehler')
        + box(`${deN(r.guete * 100, 0)} %`, `Güte · Streuung ${deN(r.streuung, 2)} ms`, bad ? 'off' : '')
        + box(bphTxt(r.bph), `gehört: ${r.frequenz.quarz ? 'Quarz' : nf(r.frequenz.bph, 0) + ' A/h'}`);
      if (z.w?.liftAngle && !quarz) html += box(r.amplitude ? `${deN(medianOf(g.map(x => x.amplitude)) ?? r.amplitude, 0)}°` : '–', `Amplitude (L ${nf(z.w.liftAngle, 0)}°), experimentell`);
      if (r.gestoert) html += `<p class="notice warn" style="margin:0;grid-column:1/-1">Aufnahme gestört: Der Handy-Takt weicht um ${sgn(r.ppm, 0)} ppm ab (Bildschirm aus oder Aussetzer). Display anlassen und neu starten.</p>`;
      else if (bad) html += `<p class="notice warn" style="margin:0;grid-column:1/-1">Unsicher (Störung? zu leise?): Güte ${deN(r.guete * 100, 0)} %, Streuung ${deN(r.streuung, 2)} ms. Der Wert zählt nicht.</p>`;
    } else if (r?.fehler) html += `<p class="notice warn" style="margin:0;grid-column:1/-1">${esc(r.fehler)} (${r.gefunden}/${r.erwartet}). Uhr direkt aufs Mikrofon legen, leiser Raum.</p>`;
    $('zw-vals').innerHTML = html;
    zwStrip(r);
  }

  function zwStrip(r) {
    const c = document.getElementById('zw-strip'); if (!c) return;
    const dpr = devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight, css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    c.width = w * dpr; c.height = h * dpr;
    const g = c.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, w, h); g.font = '11px system-ui';
    if (!r?.streifen?.length) { g.fillStyle = css('--muted'); g.fillText('Der Zeitwaagen-Streifen erscheint nach den ersten Sekunden.', 10, h / 2); return; }
    // Vorzeichen wie an einer Zeitwaage: Tick früher als das Soll-Raster = oben, eine vorgehende Uhr steigt also an
    const ts = r.streifen.map(p => p.t), ms = r.streifen.filter(p => p.genutzt).map(p => -p.ms);
    const tMin = Math.min(...ts), tMax = Math.max(...ts);
    let lo = Math.min(...ms), hi = Math.max(...ms); const rand = Math.max(0.5, (hi - lo) * 0.25); lo -= rand; hi += rand;
    const x = t => 44 + (t - tMin) / ((tMax - tMin) || 1) * (w - 54), y = v => h - 20 - (v - lo) / (hi - lo) * (h - 30);
    g.strokeStyle = css('--line'); g.fillStyle = css('--muted');
    for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4; g.beginPath(); g.moveTo(44, y(v)); g.lineTo(w - 10, y(v)); g.stroke(); g.fillText(`${sgn(v, 1)} ms`, 2, y(v) + 4); }
    g.fillText(`${deN(tMax - tMin, 0)} s`, w - 34, h - 4);
    // Tick und Tack in zwei Farben: Steigung = Gang, Abstand der beiden Linien = Abfallfehler
    for (const p of r.streifen) {
      g.fillStyle = p.genutzt ? css(p.n % 2 ? '--lume' : '--accent') : css('--line');
      g.fillRect(x(p.t) - 1.5, Math.max(4, Math.min(h - 24, y(-p.ms))) - 1.5, 3, 3);
    }
  }

  async function zwStart() {
    if (zwFreq(S.zw).quarz) { S.zw.msg = quarzHinweis(false); return zwShow(''); }
    const z = S.zw, lib = z.lib, test = new URLSearchParams(location.search).get('zwtest');
    if (!test && (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia)) return zwShow('Kein Mikrofon: Die Seite braucht eine sichere Verbindung (HTTPS, z. B. über GitHub Pages).');
    zwStop();
    Object.assign(z, { gute: [], hoer: [], unruhig: 0, lang: false, last: null, msg: '', rest: null });
    zwShow('Mikrofon wird geöffnet …');
    let stream = null, ctx = null;
    try {
      let quelle;
      if (test) {   // Aufnahme statt Mikrofon, gleicher Weg ab dem Worklet
        ctx = new AudioContext({ sampleRate: 48000 });
        const buf = await ctx.decodeAudioData(await (await fetch(new URL(test, location.href).href)).arrayBuffer());
        quelle = ctx.createBufferSource(); quelle.buffer = buf;
      } else {
        stream = await navigator.mediaDevices.getUserMedia({ audio: { ...lib.MIKRO, ...(z.devId ? { deviceId: { exact: z.devId } } : {}) } });
        const s = stream.getAudioTracks()[0].getSettings?.() || {};
        ctx = new AudioContext(s.sampleRate ? { sampleRate: s.sampleRate } : {});   // eigene Rate des Mikrofons, Chrome rechnet nicht um
        quelle = ctx.createMediaStreamSource(stream);
      }
      await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([lib.WORKLET], { type: 'text/javascript' })));
      if (S.zw !== z) throw new Error('geschlossen');
      const node = new AudioWorkletNode(ctx, 'sammler');
      quelle.connect(node);   // nicht an die Lautsprecher, sonst Rückkopplung
      quelle.start?.();
      const sr = ctx.sampleRate, ring = new Float32Array(sr * 120);
      const run = z.run = { stream, ctx, quelle, sr, ring, pos: 0, gesamt: 0, seit: 2 * sr, takt: [], test: !!test };
      node.port.onmessage = ({ data: { k, t, f } }) => {
        for (const v of k) { ring[run.pos] = v; run.pos = (run.pos + 1) % ring.length; } run.gesamt += k.length;
        if (f > 5 * sr && (!run.takt.length || t - run.takt.at(-1)[0] >= 1000)) run.takt.push([t, f]);
      };
      run.timer = setInterval(zwTick, 2000);
      run.sperre = await navigator.wakeLock?.request('screen').catch(() => null);   // Bildschirm aus = Mikrofon aus
      if (stream && !z.devs.length) {   // Gerätenamen gibt es erst nach der Freigabe
        z.devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput' && d.deviceId);
        z.devId ||= stream.getAudioTracks()[0].getSettings?.().deviceId || null;
        if (z.devs.length > 1) renderZw();
      }
      zwShow('nimmt auf …');
    } catch (er) {
      if (!z.run) { stream?.getTracks().forEach(t => t.stop()); ctx?.close().catch(() => {}); } else zwStop();
      if (S.zw !== z) return;
      console.error(er);
      zwShow(er?.name === 'NotAllowedError' ? 'Mikrofon nicht erlaubt. In den Website-Einstellungen des Browsers freigeben.' : `Mikrofon nicht verfügbar: ${er?.message || er}`);
    }
  }
  function zwStop() {
    const run = S.zw?.run; if (!run) return;
    clearInterval(run.timer);
    run.stream?.getTracks().forEach(t => t.stop());
    try { run.quelle.stop?.(); } catch (e) {}
    run.ctx.close().catch(() => {}); run.sperre?.release().catch(() => {});
    S.zw.dauer = Math.round(Math.max(0, run.gesamt - run.seit) / run.sr);
    S.zw.rest = run;   // Ringpuffer behalten, damit die Aufnahme auch nach dem Stoppen noch gespeichert werden kann
    S.zw.run = null;
  }
  // Android stoppt das Mikrofon im Hintergrund: dann lieber sauber beenden als mit Lücken weiterrechnen
  document.addEventListener('visibilitychange', () => { if (document.hidden && S.zw?.run) { zwStop(); zwShow('unterbrochen: App war im Hintergrund'); } });

  function zwTick() {
    const z = S.zw, run = z?.run; if (!run) return;
    const lib = z.lib, f = zwFreq(z), sr = run.sr, da = (run.gesamt - run.seit) / sr;
    if (da < 4) return zwShow(da < 0 ? 'Uhr liegt still …' : `nimmt auf … ${deN(da, 0)} s`);
    // Quarz: 1 Tick pro Sekunde, deshalb bis zu 2 min auswerten (Genauigkeit wächst mit Dauer^1,5); ebenso mechanisch,
    // wenn die Ticks über 20 s mäßig stark streuen (Co-Axial: 0,9–1,5 ms, Tick und Tack klingen verschieden)
    const quarz = (f.bph ?? z.last?.bph) === 3600, fenster = quarz || z.lang ? 120 : 20;
    const n = Math.round(Math.min(fenster, da) * sr), samples = new Float32Array(n);
    for (let i = 0; i < n; i++) samples[i] = run.ring[(run.pos - n + i + run.ring.length) % run.ring.length];
    const r = lib.analyse(samples, sr, { bph: f.bph, nurMech: f.nurMech, hebung: z.w?.liftAngle || 52, kalibPpm: z.calib, verwerfen: 0 });
    delete r.hp; delete r.env; delete r.ds;   // große Puffer nicht festhalten
    // Unbekannte Uhr klingt nach Quarz: nicht weiter messen, sondern auf den Abgleich verweisen
    if (!f.bph && !r.fehler && r.frequenz.quarz && r.guete >= lib.GUETE_MIN) {
      zwStop(); Object.assign(z, { last: null, gute: [], msg: quarzHinweis(!!z.w && !z.saved) });
      return zwShow('gestoppt: klingt nach Quarzuhr');
    }
    z.last = r;
    // Quarz: unter 2 min schwankt der Gang noch um mehrere s/Tag (Prototyp: 60 s → +2,5…+8,5), deshalb erst dann zählen
    r.vorlaeufig = r.bph === 3600 && n / sr < 110;
    // Takt-Wächter: Bei Bildschirm aus liefert Android das Audio lückenhaft, die Aufnahme sieht aber normal aus (Befund
    // 28.10.2026: −382 ppm und ein Schein-Takt). Weicht der Takt gegen die Systemuhr um mehr als 20 ppm ab, zählt nichts.
    const ppm = lib.taktPpm(run.takt, sr);
    r.ppm = ppm; r.gestoert = !run.test && ppm != null && Math.abs(ppm) > 20;   // Testmodus: Takt der PC-Soundkarte, ohne Aussage
    const bad = !r.fehler && (lib.unsicher(r) || r.vorlaeufig || r.gestoert);
    // Amplitude ist experimentell (M3): nur glaubhafte Werte, sonst lieber keine (Teilgeräusche oft nicht getrennt hörbar)
    if (!(r.amplitude >= 150 && r.amplitude <= 360)) r.amplitude = null;
    if (!r.fehler && !bad) z.gute = [...z.gute, { gang: r.gang, abfall: r.abfall, amplitude: r.amplitude, guete: r.guete, bph: r.bph }].slice(-5);
    if (!z.lang && !quarz && !r.fehler && r.guete >= lib.GUETE_MIN && r.streuung > lib.STREUUNG_MAX && r.streuung < 4 * lib.STREUUNG_MAX && ++z.unruhig >= 2) z.lang = true;
    // Widerspruch zur eingetragenen Frequenz erst melden, wenn das Gehörte dreimal gleich war
    z.hoer = [...z.hoer, r.frequenz.quarz ? 3600 : r.frequenz.bph].slice(-3);
    const gehoert = z.hoer.length === 3 && z.hoer.every(b => b === z.hoer[0]) ? z.hoer[0] : null;
    if (f.check && gehoert && gehoert !== f.bph)
      z.msg = `<p class="notice warn" style="margin:0">Gehört wird ${bphTxt(gehoert)}, eingetragen sind ${bphTxt(f.bph)}. Richtige Uhr? <button class="btn small" data-act="zw-use" data-bph="${gehoert}">Mit ${bphTxt(gehoert)} messen</button></p>`;
    else if (!f.bph && z.gute.length && !z.saved && z.w)
      z.msg = `<p class="notice" style="margin:0">Erkannt: ${bphTxt(r.bph)}. <button class="btn small" data-act="zw-save-bph" data-bph="${r.bph}">${r.bph === 3600 ? 'Als Quarzwerk an der Uhr speichern' : 'An der Uhr speichern'}</button></p>`;
    else if (!z.saved) z.msg = '';
    zwShow(`live · ${deN(n / sr, 0)} s ausgewertet${quarz ? ' (bis 120 s)' : z.lang ? ' (Streuung hoch: bis 120 s)' : ''}${ppm != null ? ` · Handy-Takt ${sgn(ppm, 0)} ppm` : ''}`);
  }

  async function zwSaveBph(bph) {
    const z = S.zw, w = z.w; if (!w) return;
    const patch = bph === 3600 ? { movementKind: 'Quarz' } : { bph };
    try {
      await S.db.collection('watches').doc(w.id).update(patch);
      z.w = { ...w, ...patch }; z.saved = true;
      z.msg = `<p class="notice" style="margin:0">${bph === 3600 ? 'Als Quarzwerk' : bphTxt(bph)} an der Uhr gespeichert.</p>`;
      document.getElementById('zw-fq').textContent = bph === 3600 ? 'Quarz: 1 Tick pro Sekunde' : `${bphTxt(bph)}, an der Uhr eingetragen`;
      zwShow();
    } catch (er) { fail(er, 'Speichern'); }
  }

  // Rohaufnahme als WAV (16 Bit, Mono, eigene Abtastrate) zum Nachrechnen im Labor: zeitwaage-labor/aufnahmen/
  function zwWav() {
    const z = S.zw, a = z?.run || z?.rest; if (!a?.gesamt) return;
    const n = Math.min(a.gesamt, a.ring.length), b = new DataView(new ArrayBuffer(44 + n * 2));
    const str = (o, t) => [...t].forEach((c, i) => b.setUint8(o + i, c.charCodeAt(0)));
    str(0, 'RIFF'); b.setUint32(4, 36 + n * 2, true); str(8, 'WAVEfmt '); b.setUint32(16, 16, true); b.setUint16(20, 1, true);
    b.setUint16(22, 1, true); b.setUint32(24, a.sr, true); b.setUint32(28, a.sr * 2, true); b.setUint16(32, 2, true); b.setUint16(34, 16, true);
    str(36, 'data'); b.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) b.setInt16(44 + i * 2, Math.max(-1, Math.min(1, a.ring[(a.pos - n + i + a.ring.length) % a.ring.length])) * 32767, true);
    const name = `${todayStr()}-${slugName(z.w?.name)}-${z.pos}-${Math.round(n / a.sr)}s.wav`.replace(/[^\wäöüÄÖÜß.-]+/g, '-');
    const link = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([b], { type: 'audio/wav' })), download: name });
    link.click(); setTimeout(() => URL.revokeObjectURL(link.href), 10000);
    toast(`${name} gespeichert (Downloads)`);
  }
  const slugName = s => String(s || 'uhr').toLowerCase().replace(/\s+/g, '-');

  // Werte ins Formular; gespeichert wird wie bisher mit „Messung eintragen“
  function zwTake() {
    const z = S.zw, g = z.gute; if (!g.length) return;
    zwStop();   // Mikrofon sofort freigeben
    const el = document.querySelector('form[data-form="measure"]')?.elements; if (!el) return closeZw();
    const rnd = (v, d) => v == null ? null : Math.round(v * 10 ** d) / 10 ** d, bph = g.at(-1).bph, quarz = bph === 3600;
    const amp = z.w?.liftAngle && !quarz ? medianOf(g.map(x => x.amplitude)) : null;
    const jetzt = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 16);
    Object.assign(S.mEditing, {
      watchId: el.watchId.value, kind: 'waage', at: S.mEditing.id ? el.at.value : jetzt, note: el.note.value.trim() || null,
      position: z.pos, rate: rnd(medianOf(g.map(x => x.gang)), 1), beatError: quarz ? null : rnd(medianOf(g.map(x => x.abfall)), 2), bph,
      amplitude: amp != null ? Math.round(amp) : el.amplitude?.value ? Number(el.amplitude.value) : null,
      method: 'mikro', dur: z.dauer || null, quality: rnd(medianOf(g.map(x => x.guete)), 2), calibPpm: z.calib,
    });
    closeZw(); render();
    toast('Werte übernommen. Jetzt „Messung eintragen“ tippen.');
  }

  // ----- watch form (create / edit) -----

    ]],

        catch (er) { console.error(er); if (btn) { btn.disabled = false; btn.textContent = label; } return toast(photoErr(er)); }
      }
      try { await saveWatch(id, data); toast(base ? 'Gespeichert' : 'Uhr angelegt'); S.editing = false; S.creating = false; go('detail', id); }
      catch (er) { fail(er, 'Speichern'); }
    }
    if (f.dataset.form === 'todo') {
      const txt = f.elements.t.value.trim(); if (!txt) return;
      const w = W(S.detailId);
      try { await S.db.collection('watches').doc(w.id).update({ todos: [...(w.todos || []), { t: txt, done: false }] }); }
      catch (er) { fail(er, 'Hinzufügen'); }
    }
    if (f.dataset.form === 'measure') {
      const el = f.elements; const num = n => el[n] && el[n].value !== '' ? Number(el[n].value) : null;
      const kind = el.kind.value;
      const at = el.at.value ? new Date(el.at.value).toISOString() : new Date().toISOString();
      const data = { watchId: el.watchId.value, kind, at, note: el.note.value.trim() || null };
      if (kind === 'waage') Object.assign(data, { position: el.position.value, rate: num('rate'), amplitude: num('amplitude'), beatError: num('beatError'), bph: num('bph') });
      if (kind === 'waage' && S.mEditing?.method === 'mikro') for (const k of ['method', 'dur', 'quality', 'calibPpm']) if (S.mEditing[k] != null) data[k] = S.mEditing[k];
      else Object.assign(data, { deviation: num('deviation'), days: num('days') });
      if (S.mEditing?.photo) data.photo = S.mEditing.photo;
      try {
        if (S.mEditing?.id) await S.db.collection('measurements').doc(S.mEditing.id).set(data);
        else await S.db.collection('measurements').add(data);
        S.mEditing = null; toast('Messung gespeichert'); render();
      } catch (er) { fail(er, 'Speichern'); }
    }
  });

  // ---------- lokaler Speicher (IndexedDB, bleibt auf diesem Gerät) ----------
  const COLS = ['watches', 'measurements', 'wear'];
  const LOCAL = (() => {
    let idb; const cache = { watches: new Map(), measurements: new Map(), wear: new Map() }; const subs = { watches: [], measurements: [], wear: [] };
    const open = () => new Promise((res, rej) => {
      const r = indexedDB.open('uhrenbox', 1);
      r.onupgradeneeded = () => { for (const c of [...COLS, 'photos']) r.result.createObjectStore(c); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    const tx = (stores, mode, fn) => new Promise((res, rej) => { const t = idb.transaction(stores, mode); const out = fn(t); t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
    const getAll = store => new Promise((res, rej) => { const out = []; const r = idb.transaction(store).objectStore(store).openCursor(); r.onsuccess = () => { const c = r.result; if (c) { out.push([c.key, c.value]); c.continue(); } else res(out); }; r.onerror = () => rej(r.error); });
    const emit = col => { const snap = { docs: [...cache[col]].map(([id, v]) => ({ id, data: () => structuredClone(v) })) }; subs[col].forEach(fn => fn(snap)); };
    const clean = o => JSON.parse(JSON.stringify(o ?? {}));
    async function put(col, id, data) { data = clean(data); delete data.id; await tx(col, 'readwrite', t => t.objectStore(col).put(data, id)); cache[col].set(id, data); noteChange(); emit(col); }
    async function del(col, id) { await tx(col, 'readwrite', t => t.objectStore(col).delete(id)); cache[col].delete(id); noteChange(); emit(col); }
    const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const db = {
      collection: col => ({
        doc: id => ({
          set: data => put(col, id, data),
          update: patch => put(col, id, { ...(cache[col].get(id) || {}), ...clean(patch) }),
          delete: () => del(col, id),
        }),
        add: async data => { const id = newId(); await put(col, id, data); return { id }; },
        onSnapshot: fn => { subs[col].push(fn); queueMicrotask(() => emit(col)); return () => { subs[col] = subs[col].filter(x => x !== fn); }; },
      }),
    };
    async function shrink(file) {
      // grosse Handyfotos auf max. 1600 px verkleinern, spart Platz und macht Sicherungen handlich
      try {
        const bmp = await createImageBitmap(file); const max = 1600; const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
        if (k === 1 && file.size < 1.5e6) return file;
        const c = Object.assign(document.createElement('canvas'), { width: Math.round(bmp.width * k), height: Math.round(bmp.height * k) });
        c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
        return await new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', 0.85));
      } catch { return file; }
    }
    const assets = {
      upload: async file => {
        if (!file.type?.startsWith('image/')) throw { code: 'unsupported_type' };
        const blob = await shrink(file); const id = 'foto-' + newId();
        await tx('photos', 'readwrite', t => t.objectStore('photos').put(blob, id));
        PHOTO_URLS.set(id, URL.createObjectURL(blob));
        return { id };
      },
      delete: async id => { await tx('photos', 'readwrite', t => t.objectStore('photos').delete(id)); const u = PHOTO_URLS.get(id); if (u) URL.revokeObjectURL(u); PHOTO_URLS.delete(id); },
    };
    return {
      db, assets,
      async init() {
        idb = await open();
        for (const col of COLS) for (const [id, v] of await getAll(col)) cache[col].set(id, v);
        for (const [id, blob] of await getAll('photos')) PHOTO_URLS.set(id, URL.createObjectURL(blob));
      },
      allPhotos: () => getAll('photos'),
      async replaceAll(cols, photos) {
        await tx([...COLS, 'photos'], 'readwrite', t => {
          for (const c of [...COLS, 'photos']) t.objectStore(c).clear();
          for (const c of COLS) for (const d of cols[c]) { const { id, ...rest } = d; if (id) t.objectStore(c).put(clean(rest), String(id)); }
          for (const [id, blob] of photos) t.objectStore('photos').put(blob, id);
        });
        for (const u of PHOTO_URLS.values()) URL.revokeObjectURL(u);
        PHOTO_URLS.clear();
        for (const [id, blob] of photos) PHOTO_URLS.set(id, URL.createObjectURL(blob));
        for (const c of COLS) { cache[c].clear(); for (const d of cols[c]) { const { id, ...rest } = d; if (id) cache[c].set(String(id), clean(rest)); } emit(c); }
      },
    };
  })();

  // ---------- PWA: Installieren, Offline-Speicher, Updates ----------
  addEventListener('beforeinstallprompt', e => { INSTALL.prompt = e; renderFoot(); });
  addEventListener('appinstalled', () => { INSTALL.prompt = null; renderFoot(); toast('Uhrenbox ist jetzt als App installiert'); });
  function setupSW() {
    if (!('serviceWorker' in navigator) || !(location.protocol === 'https:' || location.hostname === 'localhost')) return;
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloading) location.reload(); });
    navigator.serviceWorker.register('sw.js').then(reg => {
      // neue Version liegt bereit: erst auf Knopfdruck übernehmen, damit nichts Halbfertiges verloren geht
      const offer = w => {
        if (!w || !navigator.serviceWorker.controller) return;
        const bar = document.getElementById('update'); bar.hidden = false;
        bar.querySelector('button').onclick = () => { reloading = true; w.postMessage('skipWaiting'); };
      };
      offer(reg.waiting);
      reg.addEventListener('updatefound', () => { const w = reg.installing; w?.addEventListener('statechange', () => { if (w.state === 'installed') offer(w); }); });
      setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);   // bei langer Nutzung ab und zu nachsehen
    }).catch(() => {});
  }
  // Kurzbefehle aus dem App-Icon (siehe manifest.webmanifest)
  function runShortcut(act) {
    if (act === 'messung') {
      go('messungen');
      if (S.canWrite && S.watches.length) { S.mEditing = { watchId: (S.watches.find(isMech) || S.watches[0]).id }; render(); }
    } else if (act === 'tragen') go('tagebuch');
    else if (act === 'wristcheck' && S.canWrite) openWc(false);   // ohne Tipp darf der Browser die Kamera nicht öffnen: Knopf im Fenster
  }

  // ---------- boot ----------
  setupSW();
  const shortcut = new URLSearchParams(location.search).get('aktion');
  if (shortcut) { try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {} }
  fromHash(); render();
  (async () => {
    try { await LOCAL.init(); }
    catch (e) { console.error(e); app.innerHTML = `<div class="empty"><h3>Speicher nicht verfügbar</h3><p>Dieser Browser erlaubt der Uhrenbox keinen lokalen Speicher (z. B. im privaten Modus). Öffne sie in einem normalen Browserfenster.</p></div>`; return; }
    try { await navigator.storage?.persist?.(); } catch (e) {}
    refreshStore();
    S.db = LOCAL.db; S.assets = LOCAL.assets;
    const db = S.db;
    db.collection('watches').onSnapshot(snap => {
      S.watches = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      S.loaded.watches = true;
      if (S.cmpSel) S.cmpSel = S.cmpSel.filter(id => W(id)).concat(S.watches.filter(w => !S.cmpSel.includes(w.id) && !S._seen?.has(w.id)).map(w => w.id));
      S._seen = new Set(S.watches.map(w => w.id));
      if (!S.editing && !S.creating && !S.mEditing) render(); else if (S.view === 'detail' && !S.editing) render();
    });
    db.collection('measurements').onSnapshot(snap => {
      S.measurements = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      S.loaded.measurements = true;
      if (!S.editing && !S.creating && !S.mEditing) render();
    });
    db.collection('wear').onSnapshot(snap => {
      const w = {}, shots = {}; snap.docs.forEach(d => { const x = d.data(); if (Array.isArray(x.watches)) w[d.id] = x.watches; if (x.shots) shots[d.id] = x.shots; });
      S.wear = w; S.wearShots = shots; S.loaded.wear = true;
      if (!S.editing && !S.creating && !S.mEditing) render();
    });
    if (shortcut) queueMicrotask(() => runShortcut(shortcut));   // nach den ersten Snapshots
  })();
})();
</script>

</body></html>
