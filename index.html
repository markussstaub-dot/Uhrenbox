<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBFBF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1E21" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Uhrenbox">
<title>Uhrenbox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23FBFBF8' stroke='%231C1F22' stroke-width='2.4'/%3E%3Cpath d='M16 16V7' stroke='%231C1F22' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M16 16l6 3' stroke='%23C4521E' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Layout: sticky band with tabs; one working view at a time; detail opens as its own view with a sidebar of facts beside photo + logs */
:root {
  --bg: #EFEFEA;
  --surface: #FBFBF8;
  --sunk: #E4E5DF;
  --ink: #1C1F22;
  --muted: #5E646B;
  --line: #D3D4CD;
  --accent: #C4521E;        /* seconds-hand orange */
  --accent-ink: #FFFFFF;
  --lume: #4E9C7A;
  --good: #2F7D4F;
  --warn: #A86A12;
  --bad: #B23A2E;
  --band: rgba(78,156,122,.16);
  --shadow: 0 1px 2px rgba(28,31,34,.06), 0 6px 18px rgba(28,31,34,.06);
  --f-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131517; --surface: #1B1E21; --sunk: #23272B; --ink: #E7E7E2; --muted: #9AA0A6; --line: #30353A;
  --accent: #EE7A42; --accent-ink: #1B1E21; --lume: #7CCBA6; --good: #6CC08A; --warn: #E0A84A; --bad: #EB7A6E;
  --band: rgba(124,203,166,.14); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #131517; --surface: #1B1E21; --sunk: #23272B; --ink: #E7E7E2; --muted: #9AA0A6; --line: #30353A;
  --accent: #EE7A42; --accent-ink: #1B1E21; --lume: #7CCBA6; --good: #6CC08A; --warn: #E0A84A; --bad: #EB7A6E;
  --band: rgba(124,203,166,.14); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; letter-spacing: .01em; line-height: 1.1; margin: 0; text-wrap: balance; }
h2 { font-size: 26px; }
h3 { font-size: 19px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
.muted { color: var(--muted); }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top band */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 20px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font-size: 26px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.brand svg { width: 28px; height: 28px; flex: none; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.tab { border: 0; background: none; padding: 7px 12px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 500; }
.tab:hover { color: var(--ink); background: var(--sunk); }
.tab[aria-current="page"] { background: var(--ink); color: var(--surface); }

main { padding-block: 24px 64px; }
.view-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.view-head p { margin: 4px 0 0; color: var(--muted); }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { border-color: transparent; background: none; }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.small { padding: 4px 9px; font-size: 13px; }

/* summary strip */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin-bottom: 20px; }
.summary > div { background: var(--surface); padding: 12px 14px; min-width: 0; }
.summary .big { font-family: var(--f-display); font-size: 30px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.summary .sub { font-size: 12.5px; color: var(--muted); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); background: var(--sunk); font-weight: 500; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.fav { background: var(--accent); color: var(--accent-ink); }
.pill.ordered { background: transparent; border: 1px dashed var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }

/* watch grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
/* Sammlung: kleine Foto-Kacheln (nur Bild, Name, Marke), Reiter Favoriten/Alle, Suche und Sortierung */
.ctabs { display: flex; gap: 6px; margin-bottom: 10px; }
.ctools { display: flex; gap: 8px; margin-bottom: 12px; }
.ctools input[type=search] { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.ctools select { padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px 10px; }
.pf { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; }
.pf input { width: 20px; height: 20px; accent-color: var(--accent); }
.pf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px 24px; }
.mcard { cursor: pointer; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.mcard .ph { aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--sunk); border: 1px solid var(--line); position: relative; }
.mcard .ph img, .mcard .ph svg, .mcard .ph .dial-ph { width: 100%; height: 100%; object-fit: cover; display: block; }
.mcard .ph .pill { position: absolute; left: 6px; bottom: 6px; font-size: 11px; background: var(--surface); }
.mcard .ph .star { position: absolute; right: 6px; top: 4px; color: #F2C14E; text-shadow: 0 1px 4px rgba(0,0,0,.6); font-size: 16px; }
.mcard:hover .ph { border-color: var(--muted); }
.mcard .nm { font-weight: 600; font-size: 14px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mcard .br { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: -2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.card:hover { border-color: var(--muted); box-shadow: var(--shadow); }
.card .ph { aspect-ratio: 4 / 3; background: var(--sunk); position: relative; overflow: hidden; max-width: 100%; }
.card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .ph .nr { position: absolute; left: 10px; top: 8px; font-family: var(--f-display); font-weight: 700; font-size: 22px; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.55); }
.card .ph .badges { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; }
.card .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card .title { display: flex; align-items: baseline; gap: 8px; justify-content: space-between; }
.card .title h3 { font-size: 21px; }
.card .homage { font-size: 13px; color: var(--muted); line-height: 1.35; }
.card .specs { display: flex; gap: 12px; font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.card .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.wear-btn { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.wear-btn[aria-pressed="true"] { background: var(--lume); border-color: var(--lume); color: var(--surface); font-weight: 500; }
.dial-ph { width: 100%; height: 100%; display: grid; place-items: center; }
.dial-ph svg { width: 56%; height: auto; }

/* detail */
.back { margin-bottom: 14px; }
.detail { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .detail { grid-template-columns: minmax(0, 1fr); } }
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.hero .ph { aspect-ratio: 4 / 3; background: var(--sunk); max-width: 100%; }
.hero .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero .cap { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.hero h2 { font-size: 34px; }
.hero .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
dl.facts { display: grid; grid-template-columns: minmax(110px, auto) minmax(0, 1fr); gap: 7px 14px; margin: 0; font-size: 14px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; overflow-wrap: anywhere; }
dl.facts dd.open { color: var(--muted); font-style: italic; }
.todo { display: flex; gap: 9px; align-items: flex-start; font-size: 14px; }
.todo input { margin-top: 3px; accent-color: var(--accent); }
.todo.done span { color: var(--muted); text-decoration: line-through; }
.todo-add { display: flex; gap: 8px; }
.todo-add input { flex: 1; min-width: 0; }

/* timegrapher readout */
.tg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.tg > div { background: var(--ink); color: var(--surface); padding: 10px 12px; min-width: 0; }
.tg .v { font-family: var(--f-mono); font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.15; }
.tg .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .7; }
.tg .ok { color: var(--lume); }
.tg .warn { color: #F2B45A; }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 500; background: var(--sunk); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
.state-ok { color: var(--good); }
.state-warn { color: var(--warn); }
.state-bad { color: var(--bad); }

/* forms */
form.grid-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: 12.5px; color: var(--muted); }
input[type=text], input[type=number], input[type=date], input[type=datetime-local], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 7px 9px; min-width: 0; }
textarea { min-height: 80px; resize: vertical; }
input[type=color] { width: 44px; height: 34px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); padding: 2px; }
fieldset { border: 0; padding: 0; margin: 0; display: contents; }
.form-group-title { grid-column: 1 / -1; font-family: var(--f-display); font-size: 18px; font-weight: 600; margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.form-group-title:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.photo-prev img { width: 96px; height: 72px; object-fit: cover; border-radius: 6px; display: block; border: 1px solid var(--line); }
.photo-prev:empty { display: none; }

/* gallery */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.gallery.big { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.thumb { position: relative; margin: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.thumb > button.img { border: 0; padding: 0; background: var(--sunk); border-radius: 8px; overflow: hidden; aspect-ratio: 1; cursor: zoom-in; display: block; width: 100%; max-width: 100%; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s; }
.thumb > button.img:hover img { transform: scale(1.03); }
.thumb .cover-tag { position: absolute; left: 6px; top: 6px; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); pointer-events: none; }
.thumb .tools { display: flex; gap: 2px; flex-wrap: wrap; }
.thumb figcaption { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thumb figcaption a { color: var(--ink); text-decoration: none; }
.thumb figcaption a:hover { color: var(--accent); }
.add-tile { border: 1px dashed var(--line); border-radius: 8px; aspect-ratio: 1; display: grid; place-items: center; color: var(--muted); cursor: pointer; font-size: 13px; text-align: center; padding: 8px; background: var(--surface); max-width: 100%; }
.add-tile:hover { border-color: var(--muted); color: var(--ink); }
/* lightbox: deliberately dark in both themes, like a photo viewer */
.lb { position: fixed; inset: 0; z-index: 30; background: rgba(10,11,12,.94); color: #EDEDE8; display: flex; flex-direction: column; gap: 10px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.lb .bar { display: flex; align-items: center; gap: 12px; }
.lb .cap { font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb .cnt { font-family: var(--f-mono); font-size: 13px; opacity: .7; }
.lb .stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; gap: 8px; }
.lb .stage img { max-width: calc(100% - 112px); max-height: calc(100vh - 120px); object-fit: contain; border-radius: 4px; }
.lb button { background: rgba(255,255,255,.12); border: 0; color: #EDEDE8; border-radius: 999px; width: 44px; height: 44px; font-size: 24px; line-height: 1; cursor: pointer; flex: none; }
.lb button:hover { background: rgba(255,255,255,.22); }
.lb :focus-visible { outline-color: #EDEDE8; }
@media (max-width: 560px) { .lb .stage img { max-width: 100%; } .lb .stage { position: relative; } .lb .stage button { position: absolute; bottom: 0; } .lb .stage button[data-lb-step="-1"] { left: 0; } .lb .stage button[data-lb-step="1"] { right: 0; } }

/* chart */
.chart svg { width: 100%; height: auto; display: block; }
.chart .axis { fill: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.chart .grid-line { stroke: var(--line); stroke-width: 1; }
.chart .zero { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .band { fill: var(--band); }
.chart .band-edge { stroke: var(--lume); stroke-width: 1; stroke-dasharray: 2 3; opacity: .8; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; }
.chart .pt { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart .pt.last { fill: var(--accent); }
.chart .val { fill: var(--ink); font-family: var(--f-mono); font-size: 11.5px; }

/* diary */
.diary { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .diary { grid-template-columns: minmax(0, 1fr); } }
.pick { display: flex; flex-wrap: wrap; gap: 8px; }
.pick button { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px 6px 8px; cursor: pointer; font-size: 14px; }
.pick button[aria-pressed="true"] { border-color: var(--ink); background: var(--sunk); font-weight: 600; }
.cal-wrap { overflow-x: auto; }
.cal { display: grid; grid-auto-flow: column; grid-template-rows: auto repeat(7, 16px); gap: 3px; width: max-content; }
.cal .m { font-size: 10.5px; color: var(--muted); height: 14px; white-space: nowrap; font-family: var(--f-mono); }
.cal .d { width: 16px; height: 16px; border-radius: 3px; background: var(--sunk); border: 0; padding: 0; cursor: pointer; }
.cal .d.today { outline: 2px solid var(--ink); outline-offset: -2px; }
.cal .d.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.cal .d.future { opacity: .35; cursor: default; }
.cal .d.shot { position: relative; }
.cal .d.shot::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--surface); }
.day-shots { display: flex; gap: 8px; flex-wrap: wrap; }
.day-shots button { border: 0; padding: 0; background: none; cursor: pointer; }
.day-shots img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; display: block; border: 1px solid var(--line); }
/* Wristcheck: von unten einfahrendes Blatt am Handy, mittig am Computer */
.wc { position: fixed; inset: 0; z-index: 25; background: rgba(10,11,12,.5); display: flex; align-items: flex-end; justify-content: center; }
.wc .sheet { background: var(--surface); width: min(520px, 100%); max-height: 92vh; overflow: auto; border-radius: 14px 14px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
@media (min-width: 600px) { .wc { align-items: center; } .wc .sheet { border-radius: 14px; } }
.wc .shot img { width: 100%; max-height: 36vh; object-fit: cover; border-radius: 10px; display: block; }
/* alle Uhren als Fotoraster: mit dem Auge vergleichen, die wahrscheinlichsten zuerst und markiert */
.wc .sugg { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.wc .sugg button { display: flex; flex-direction: column; gap: 4px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 5px; cursor: pointer; font: inherit; color: inherit; min-width: 0; position: relative; }
.wc .sugg button:hover { border-color: var(--muted); }
.wc .sugg button.top { border: 2px solid var(--accent); padding: 4px; }
.wc .sugg button[disabled] { opacity: .5; cursor: default; }
.wc .sugg .ph { width: 100%; aspect-ratio: 1; border-radius: 7px; overflow: hidden; background: var(--sunk); }
.wc .sugg .ph img, .wc .sugg .ph .dial-ph, .wc .sugg .ph svg { width: 100%; height: 100%; object-fit: cover; display: block; }
.wc .sugg .nm { font-weight: 600; font-size: 13.5px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wc .sugg .why { font-size: 11.5px; line-height: 1.25; color: var(--muted); }
.wc .sugg .tag { position: absolute; top: 9px; left: 9px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 7px; }
/* Zeitwaage: großer Knopf oben im Messungs-Formular, Vollbild-Messfenster darüber */
.mic-btn { width: 100%; justify-content: center; padding: 14px 12px; font-size: 17px; font-weight: 600; border: 2px solid var(--accent); color: var(--accent); }
.mic-btn:hover { border-color: var(--accent); filter: brightness(1.05); }
.zw { position: fixed; inset: 0; z-index: 26; background: var(--surface); overflow: auto; }
.zw .in { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 12px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.zw .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.zw .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.zw .vals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.zw .val { background: var(--sunk); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.zw .val b { display: block; font-family: var(--f-mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.zw .val span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.zw .val.big { grid-column: 1 / -1; } .zw .val.big b { font-size: 44px; line-height: 1.1; }
.zw .val.off b { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.zw .warn { border-left: 3px solid var(--warn); color: var(--ink); }
.zw canvas { width: 100%; height: 170px; display: block; background: var(--sunk); border-radius: 8px; }
.zw details summary { cursor: pointer; color: var(--muted); font-size: 13.5px; }
.zw .foot { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; }
.zw .foot .btn { flex: 1; justify-content: center; padding: 11px 12px; font-size: 15px; }
.wd-labels { display: grid; grid-template-rows: 14px repeat(7, 16px); gap: 3px; font-size: 10.5px; color: var(--muted); font-family: var(--f-mono); }
.cal-row { display: flex; gap: 6px; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 140px) minmax(0, 1fr) 36px; gap: 10px; align-items: center; font-size: 13.5px; }
.bar-row .track { height: 12px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar-row .fill { height: 100%; border-radius: 3px; }
.bar-row .n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.bar-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* compare */
.cmp th:first-child, .cmp td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
.cmp th:first-child { background: var(--sunk); }
.cmp td { min-width: 120px; }
.cmp .mini { height: 4px; background: var(--sunk); border-radius: 2px; margin-top: 5px; }
.cmp .mini span { display: block; height: 100%; background: var(--muted); border-radius: 2px; }
.cmp .hi { font-weight: 600; }
.cmp thead th { white-space: normal; min-width: 120px; vertical-align: bottom; }
.cmp thead th .t { font-family: var(--f-display); font-size: 16px; text-transform: none; letter-spacing: 0; color: var(--ink); font-weight: 600; display: block; }

.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 28px; text-align: center; color: var(--muted); background: var(--surface); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 8px; font-size: 14px; z-index: 20; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.notice { background: var(--sunk); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
[hidden] { display: none !important; }
img { max-width: 100%; }
.foot-note { text-align: center; color: var(--muted); font-size: 12.5px; padding: 0 16px 32px; }
.foot-note .linkish { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font-size: inherit; }
.foot-note .warn-text { color: var(--warn); }
.backup-due { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; margin-bottom: 16px; color: var(--ink); border-left: 3px solid var(--warn); }
.update { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 19; display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 8px 8px 8px 14px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M16 16 L16 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M16 16 L22 19" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="16" r="1.8" fill="currentColor"/></svg>
      <h1>Uhrenbox</h1>
    </div>
    <nav class="tabs" aria-label="Ansichten">
      <button class="tab" data-nav="sammlung">Sammlung</button>
      <button class="tab" data-nav="galerie">Galerie</button>
      <button class="tab" data-nav="messungen">Messungen</button>
      <button class="tab" data-nav="tagebuch">Tragetagebuch</button>
      <button class="tab" data-nav="vergleich">Vergleich</button>
    </nav>
  </div>
</header>

<main class="wrap" id="app">
  <div class="empty" id="boot">
    <h3>Sammlung wird geladen</h3>
    <p>Hier erscheinen gleich deine Uhren mit Fotos, Messungen und Tragetagen.</p>
  </div>
</main>
<div id="toast" class="toast" hidden></div>
<div id="lb" class="lb" hidden role="dialog" aria-modal="true" aria-label="Foto ansehen"></div>
<div id="wc" class="wc" hidden></div>
<div id="zw" class="zw" hidden role="dialog" aria-modal="true" aria-label="Zeitwaage"></div>
<!-- Wristcheck: capture öffnet am Handy direkt die Rückkamera, die zweite Auswahl erlaubt ein schon gemachtes Foto -->
<input id="wc-cam" type="file" accept="image/*" capture="environment" hidden>
<input id="wc-gal" type="file" accept="image/*" hidden>
<div id="update" class="update" hidden role="status"><span>Neue Version der Uhrenbox ist da.</span><button class="btn small primary">Neu laden</button></div>
<p class="foot-note" id="foot">Alle Daten bleiben auf diesem Gerät, in diesem Browser. Denk ab und zu an „Sichern“.</p>

<script>
(() => {
  // ---------- state ----------
  const S = {
    db: null, assets: null, canWrite: true,
    watches: [], measurements: [], wear: {},   // wear: { 'YYYY-MM-DD': [ids] }
    wearShots: {},   // Fotos zum Tragetag: { 'YYYY-MM-DD': { uhrId: fotoId } }
    wc: null,        // Wristcheck offen: { blob, url, list, busy }
    zw: null,        // Zeitwaage-Messfenster offen (Mikrofon, Live-Werte)
    loaded: { watches: false, measurements: false, wear: false },
    view: 'sammlung', detailId: null, editing: false, creating: false,
    filter: 'alle', mFilter: 'alle', diaryDate: todayStr(), statRange: '90',
    cmpSel: null, confirm: null, mEditing: null,
    galleryFilter: 'alle', galleryItems: [], lb: null,   // lb: { list: [{id, cap}], i }
  };
  const PHOTO_URLS = new Map();   // Foto-ID -> lokale Bild-URL
  const VIEWS = ['sammlung', 'galerie', 'messungen', 'tagebuch', 'vergleich', 'einstellungen'];
  const app = document.getElementById('app');

  // ---------- helpers ----------
  function todayStr(d = new Date()) {
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }
  function parseDay(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const nf = (v, d = 1) => (v == null || v === '' || isNaN(v)) ? null : Number(v).toLocaleString('de-DE', { maximumFractionDigits: d });
  const signed = (v, d = 1) => v == null ? '–' : (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v).toLocaleString('de-DE', { maximumFractionDigits: d });
  const fmtDate = s => { if (!s) return '–'; const d = new Date(s); return isNaN(d) ? esc(s) : d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }); };
  const fmtDT = s => { const d = new Date(s); return isNaN(d) ? esc(s) : d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); };
  const blobUrl = id => id ? (PHOTO_URLS.get(id) || '') : null;
  const byNr = (a, b) => (a.nr ?? 999) - (b.nr ?? 999) || String(a.name).localeCompare(b.name);
  const W = id => S.watches.find(w => w.id === id);
  const isMech = w => ['Automatik', 'Handaufzug'].includes(w?.movementKind);
  // Quarz (auch Mecaquartz): keine Zeitwaage, sondern Abgleich über Wochen (Entscheidung 29.10.2026)
  const isQuarzWerk = w => !!w && ((!!w.movementKind && !isMech(w)) || w.bph === 3600);
  const watchLabel = w => w ? `${w.brand ? w.brand + ' ' : ''}${w.name}` : 'Unbekannte Uhr';
  let toastT;
  function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
  function fail(e, what) {
    console.error(e);
    if (e?.code === 'invalid_argument') { S.canWrite = false; render(); toast(`${what} nicht möglich: Du hast hier nur Leserechte.`); }
    else if (e?.code === 'quota_exceeded') toast(`${what} fehlgeschlagen: Der Speicher ist voll.`);
    else toast(`${what} fehlgeschlagen. Bitte noch einmal versuchen.`);
  }
  const photoErr = er => er?.code === 'unsupported_type' ? 'Dieses Bildformat geht nicht. Nimm JPG, PNG oder WebP.' : er?.code === 'too_large' ? 'Das Foto ist zu groß.' : 'Hochladen fehlgeschlagen. Bitte noch einmal versuchen.';

  // ---------- Ansicht (pro Gerät, nicht in der Sicherung): Reiter, Sortierung, Felder ----------
  const PREF_KEY = 'uhrenbox.ansicht';
  const pref = (() => { try { return JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch { return {}; } })();
  function savePref(patch) { Object.assign(pref, patch); try { localStorage.setItem(PREF_KEY, JSON.stringify(pref)); } catch (e) {} }

  // ---------- Sicherungs-Status und Speicher (pro Gerät) ----------
  // meta: { lastBackup: ISO, changes: Anzahl Änderungen seit der letzten Sicherung, snoozeUntil: ISO }
  const META_KEY = 'uhrenbox.meta';
  const meta = (() => { try { return JSON.parse(localStorage.getItem(META_KEY)) || {}; } catch { return {}; } })();
  function saveMeta(patch) { Object.assign(meta, patch); try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (e) {} }
  const daysSince = iso => Math.floor((Date.now() - new Date(iso)) / 864e5);
  const relDays = iso => { const n = daysSince(iso); return n <= 0 ? 'heute' : n === 1 ? 'gestern' : `vor ${n} Tagen`; };
  const fmtBytes = n => n < 1e6 ? `${Math.max(1, Math.round(n / 1e3))} KB` : `${nf(n / 1e6, 1)} MB`;
  const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const INSTALL = { prompt: null };   // gemerktes beforeinstallprompt-Ereignis

  function backupDue() {
    if (!S.watches.length) return false;
    if (meta.snoozeUntil && new Date(meta.snoozeUntil) > new Date()) return false;
    return !meta.lastBackup || daysSince(meta.lastBackup) >= 14 || (meta.changes || 0) >= 10;
  }
  function backupBanner() {
    if (!backupDue()) return '';
    const n = meta.changes || 0;
    const why = meta.lastBackup ? `Letzte Sicherung ${relDays(meta.lastBackup)}${n ? `, seitdem ${n} Änderung${n === 1 ? '' : 'en'}` : ''}.` : 'Auf diesem Gerät gibt es noch keine Sicherung.';
    return `<div class="notice backup-due" role="status"><span><b>Zeit zum Sichern.</b> ${why}</span><span class="actions"><button class="btn small primary" data-act="export">Jetzt sichern</button><button class="btn small ghost" data-act="snooze-backup">Später</button></span></div>`;
  }
  function noteChange() { saveMeta({ changes: (meta.changes || 0) + 1 }); scheduleStore(); }

  async function refreshStore() {
    try {
      const st = navigator.storage;
      S.store = { persisted: st?.persisted ? await st.persisted() : null, usage: st?.estimate ? (await st.estimate()).usage : null };
    } catch { S.store = null; }
    renderFoot();
  }
  let storeT;
  function scheduleStore() { clearTimeout(storeT); storeT = setTimeout(refreshStore, 1500); }

  function renderFoot() {
    const el = document.getElementById('foot'); if (!el) return;
    const st = S.store, parts = [];
    if (st?.persisted === true) parts.push('Speicher dauerhaft ✓');
    else if (st?.persisted === false) parts.push('<span class="warn-text">Speicher nicht dauerhaft</span>');
    if (st?.usage) parts.push(`${fmtBytes(st.usage)} belegt`);
    parts.push(meta.lastBackup ? `Letzte Sicherung ${relDays(meta.lastBackup)}` : 'Noch nie gesichert');
    let html = parts.join(' · ');
    if (!isStandalone()) {
      if (INSTALL.prompt) html += ` · <button class="linkish" data-act="install">Als App installieren</button>`;
      else if (isIOS()) html += `<br>Tipp: In Safari über <b>Teilen → Zum Home-Bildschirm</b> als App installieren.`;
      if (st?.persisted === false) html += `<br>Als App installiert behält der Browser deine Daten zuverlässiger.`;
    }
    el.innerHTML = `${html}<br>Alle Daten bleiben auf diesem Gerät, in diesem Browser.`;
  }

  // value of a measurement in the watch's tolerance unit
  function mValue(m, w) {
    if (m.kind === 'waage') return m.rate ?? null;
    if (m.deviation == null || !m.days) return null;
    const perDay = m.deviation / m.days;
    return (w?.tolUnit === 's/Monat') ? perDay * 30 : perDay;
  }
  function tolState(v, w) {
    if (v == null || w?.tolMin == null || w?.tolMax == null) return '';
    if (v >= w.tolMin && v <= w.tolMax) return 'ok';
    const over = v < w.tolMin ? w.tolMin - v : v - w.tolMax;
    return over <= (w.tolMax - w.tolMin) * 0.25 ? 'warn' : 'bad';
  }
  const unitOf = (m, w) => m.kind === 'waage' ? 's/Tag' : (w?.tolUnit || 's/Tag');
  const wearDaysOf = id => Object.keys(S.wear).filter(d => S.wear[d].includes(id)).sort();
  const uniq = a => [...new Set(a.filter(Boolean))];
  const photosOf = w => uniq([w?.photo, ...(w?.photos || [])]);   // cover first, then the rest
  const photoInUse = (id, exceptWatch) => S.watches.some(w => w.id !== exceptWatch && photosOf(w).includes(id)) || S.measurements.some(m => m.photo === id) || Object.values(S.wearShots).some(s => Object.values(s).includes(id));

  // ---------- dial placeholder ----------
  function dialSvg(color) {
    let ticks = '';
    for (let i = 0; i < 12; i++) {
      const a = i * Math.PI / 6, r1 = i % 3 ? 40 : 36, r2 = 45;
      ticks += `<line x1="${50 + r1 * Math.sin(a)}" y1="${50 - r1 * Math.cos(a)}" x2="${50 + r2 * Math.sin(a)}" y2="${50 - r2 * Math.cos(a)}" stroke="var(--muted)" stroke-width="${i % 3 ? 1.5 : 3}"/>`;
    }
    return `<div class="dial-ph"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>${ticks}<line x1="50" y1="50" x2="50" y2="22" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/><line x1="50" y1="50" x2="70" y2="58" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><line x1="50" y1="60" x2="50" y2="12" stroke="${esc(color || 'var(--accent)')}" stroke-width="1.5"/><circle cx="50" cy="50" r="3" fill="${esc(color || 'var(--accent)')}"/></svg></div>`;
  }
  const photoHtml = w => w.photo ? `<img src="${blobUrl(w.photo)}" alt="${esc(watchLabel(w))}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'dial-ph',innerHTML:''}))">` : dialSvg(w.color);

  // ---------- navigation ----------
  function go(view, id = null) {
    S.view = view; S.detailId = id; S.editing = false; S.creating = false; S.confirm = null; S.mEditing = null;
    const token = view === 'detail' ? 'uhr-' + id : view;
    try { history.replaceState(null, '', '#' + token); } catch (e) {}
    render(); window.scrollTo({ top: 0 });
  }
  function fromHash() {
    const h = (location.hash || '').slice(1);
    if (h.startsWith('uhr-')) { S.view = 'detail'; S.detailId = h.slice(4); }
    else if (VIEWS.includes(h)) S.view = h;
  }

  // ---------- render ----------
  function render() {
    document.querySelectorAll('[data-nav]').forEach(b => b.setAttribute('aria-current', (b.dataset.nav === S.view || (S.view === 'detail' && b.dataset.nav === 'sammlung')) ? 'page' : 'false'));
    renderFoot();
    if (!S.db) return;
    if (!S.loaded.watches) return;
    const v = S.view;
    app.innerHTML = v === 'einstellungen' ? renderSettings() : v === 'detail' ? renderDetail() : v === 'galerie' ? renderGallery() : v === 'messungen' ? renderMeasurements() : v === 'tagebuch' ? renderDiary() : v === 'vergleich' ? renderCompare() : renderCollection();
  }

  // ----- Sammlung -----
  function renderCollection() {
    if (S.creating) return renderWatchForm(null);
    const ws = S.watches, owned = ws.filter(w => w.status !== 'Bestellt' && w.status !== 'Verkauft');
    const favs = ws.filter(w => w.favorite).length, tab = pref.tab === 'alle' || !favs ? 'alle' : 'fav';
    const filters = [['alle', 'Alle'], ['mech', 'Mechanisch'], ['quarz', 'Quarz'], ['taucher', 'Taucher'], ['chrono', 'Chronograph'], ['bestellt', 'Bestellt']];
    return `
      <div class="view-head">
        <div><h2>Sammlung</h2><p>${owned.length} ${owned.length === 1 ? 'Uhr' : 'Uhren'}${ws.length > owned.length ? `, ${ws.length - owned.length} bestellt` : ''}</p></div>
        <div class="actions">${S.canWrite ? `${owned.length ? '<button class="btn primary" data-act="wristcheck">📷 Was trage ich?</button>' : ''}<button class="btn${owned.length ? '' : ' primary'}" data-act="new-watch">+ Uhr</button>` : ''}<button class="btn" data-act="export" title="Alle Uhren, Messungen, Tragetage und Fotos als Datei sichern">Sichern</button><label class="btn" for="import-in" title="Eine Sicherung wieder einlesen">Laden</label><input id="import-in" type="file" accept=".json,application/json" hidden><button class="btn" data-nav="einstellungen" aria-label="Einstellungen" title="Einstellungen">⚙</button></div>
      </div>
      ${backupBanner()}
      <div class="ctabs">${favs ? `<button class="chip" data-ctab="fav" aria-pressed="${tab === 'fav'}">★ Favoriten (${favs})</button>` : ''}<button class="chip" data-ctab="alle" aria-pressed="${tab === 'alle'}">Alle (${ws.length})</button></div>
      ${tab === 'alle' ? `<div class="ctools"><input type="search" id="coll-q" placeholder="Suchen: Name, Marke, Kaliber" value="${esc(S.q || '')}" aria-label="Uhren suchen">
        <select id="coll-sort" aria-label="Sortieren">${[['nr', 'Nummer'], ['name', 'Name'], ['worn', 'Zuletzt getragen'], ['measured', 'Zuletzt gemessen']].map(([k, l]) => `<option value="${k}" ${(pref.sort || 'nr') === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="chips" style="margin-bottom:12px">${filters.map(([k, l]) => `<button class="chip" data-filter="${k}" aria-pressed="${S.filter === k}">${l}</button>`).join('')}</div>` : ''}
      <div id="coll-grid">${collGrid(tab)}</div>
    `;
  }
  // nur das Raster, damit Tippen ins Suchfeld den Fokus behält
  function collGrid(tab = pref.tab === 'alle' || !S.watches.some(w => w.favorite) ? 'alle' : 'fav') {
    const q = (S.q || '').trim().toLowerCase();
    let shown = S.watches.filter(w => {
      if (tab === 'fav') return w.favorite;
      if (q && ![w.name, w.brand, w.model, w.movement, w.homage].some(v => String(v || '').toLowerCase().includes(q))) return false;
      switch (S.filter) {
        case 'mech': return isMech(w);
        case 'quarz': return !isMech(w) && w.movementKind;
        case 'taucher': return w.category === 'Taucher';
        case 'chrono': return w.category === 'Chronograph';
        case 'bestellt': return w.status === 'Bestellt';
        default: return true;
      }
    });
    const zuletzt = {};   // id → letzter Tag (getragen) bzw. Zeitpunkt (gemessen)
    const sort = tab === 'fav' ? 'nr' : pref.sort || 'nr';
    if (sort === 'worn') for (const [d, ids] of Object.entries(S.wear)) for (const id of ids) if (!zuletzt[id] || d > zuletzt[id]) zuletzt[id] = d;
    if (sort === 'measured') for (const m of S.measurements) if (!zuletzt[m.watchId] || m.at > zuletzt[m.watchId]) zuletzt[m.watchId] = m.at;
    shown = [...shown].sort(sort === 'name' ? (a, b) => String(a.name).localeCompare(b.name, 'de')
      : sort === 'worn' || sort === 'measured' ? (a, b) => String(zuletzt[b.id] || '').localeCompare(String(zuletzt[a.id] || '')) || byNr(a, b) : byNr);
    if (!shown.length) return `<div class="empty">${!S.watches.length ? 'Noch keine Uhren gespeichert. Füge oben deine erste Uhr hinzu.' : q ? `Keine Uhr passt zu „${esc(S.q)}“.` : 'Keine Uhr passt zu diesem Filter.'}</div>`;
    return `<div class="cgrid">${shown.map(miniCard).join('')}</div>`;
  }
  function miniCard(w) {
    return `<article class="mcard" data-open="${esc(w.id)}" tabindex="0" aria-label="${esc(watchLabel(w))} öffnen">
      <div class="ph">${photoHtml(w)}${w.favorite ? '<span class="star" aria-hidden="true">★</span>' : ''}${w.status === 'Bestellt' ? '<span class="pill ordered">Bestellt</span>' : ''}</div>
      <div class="nm">${esc(w.name)}</div>${pref.brand !== false && w.brand ? `<div class="br">${esc(w.brand)}</div>` : ''}
    </article>`;
  }
  // ----- Einstellungen (pro Gerät): welche Felder die Detailseite zeigt -----
  const DETAIL_FELDER = [
    ['Stammdaten', [['homage', 'Vorbild'], ['dial', 'Zifferblatt'], ['hands', 'Zeiger'], ['bezel', 'Lünette'], ['purchased', 'Gekauft'], ['price', 'Kaufpreis'], ['dealer', 'Händler'], ['serial', 'Seriennummer']]],
    ['Gehäuse', [['diameter', 'Durchmesser'], ['lugToLug', 'Lug-to-Lug'], ['height', 'Höhe'], ['lugWidth', 'Bandanstoß'], ['waterM', 'Wasserdicht'], ['crystal', 'Glas'], ['crown', 'Krone'], ['lume', 'Leuchtmasse'], ['weight', 'Gewicht']]],
    ['Werk', [['movement', 'Kaliber'], ['movementKind', 'Art'], ['bph', 'Frequenz'], ['liftAngle', 'Hebungswinkel'], ['tol', 'Toleranz']]],
    ['Band', [['strap', 'Aktuelles Band'], ['strapExtra', 'Weitere Bänder']]],
  ];
  function renderSettings() {
    const hide = pref.hide || [], sw = (id, an, text) => `<label class="pf"><input type="checkbox" data-pf="${id}" ${an ? 'checked' : ''}><span>${text}</span></label>`;
    return `
      <button class="btn ghost back" data-nav="sammlung">← Sammlung</button>
      <div class="view-head"><div><h2>Einstellungen</h2><p>Gilt nur für dieses Gerät. Ausgeblendete Felder behalten ihre Werte, sie werden nur nicht angezeigt.</p></div></div>
      <section class="panel"><h3>Ansicht</h3>
        ${sw('opt:leer', pref.leer !== false, 'Leere Felder auf der Detailseite ausblenden')}
        ${sw('opt:brand', pref.brand !== false, 'Marke unter den Kacheln der Sammlung zeigen')}
      </section>
      <section class="panel"><h3>Felder auf der Detailseite</h3>
        <div class="pf-grid">${DETAIL_FELDER.map(([titel, fs]) => `<div><div class="label" style="margin-bottom:4px">${titel}</div>${fs.map(([k, l]) => sw(k, !hide.includes(k), l)).join('')}</div>`).join('')}</div>
      </section>`;
  }

  // ----- Detail -----
  function renderDetail() {
    const w = W(S.detailId);
    if (!w) return `<button class="btn ghost back" data-nav="sammlung">← Sammlung</button><div class="empty">Diese Uhr gibt es nicht (mehr).</div>`;
    if (S.editing) return renderWatchForm(w);
    const ms = S.measurements.filter(m => m.watchId === w.id).sort((a, b) => String(a.at).localeCompare(String(b.at)));
    const days = wearDaysOf(w.id);
    const f = (k, l, v) => {
      if ((pref.hide || []).includes(k)) return '';   // in den Einstellungen ausgeblendet
      const val = v ?? w[k]; const has = val != null && val !== '';
      if (!has && pref.leer !== false) return '';     // leere Felder standardmäßig weglassen
      return `<dt>${l}</dt><dd class="${has ? '' : 'open'}">${has ? esc(val) : 'offen'}</dd>`;
    };
    const sec = (titel, inhalt) => inhalt.trim() ? `<section class="panel"><h3>${titel}</h3><dl class="facts">${inhalt}</dl></section>` : '';
    const mm = (k) => w[k] != null && w[k] !== '' ? nf(w[k], 2) + ' mm' : null;
    const todos = w.todos || [];
    const tol = w.tolMin != null && w.tolMax != null ? `${signed(w.tolMin, 0)} bis ${signed(w.tolMax, 0)} ${esc(w.tolUnit || 's/Tag')}` : null;
    const priceTxt = typeof w.price === 'number' ? `${nf(w.price, 0)} €${w.priceNote ? ' · ' + w.priceNote : ''}` : (w.priceNote || null);
    return `
      <button class="btn ghost back" data-nav="sammlung">← Sammlung</button>
      ${S.canWrite && w.status !== 'Bestellt' && !(S.mEditing && S.mEditing.watchId === w.id) ? `<button class="btn mic-btn" style="margin-bottom:12px" data-act="measure-watch" data-w="${esc(w.id)}">${isQuarzWerk(w) ? '⏱ Gang abgleichen (Funkuhr)' : '🎙 Messen'}</button>` : ''}
      <div class="detail">
        <div class="stack">
          <section class="hero">
            <div class="ph">${photoHtml(w)}</div>
            <div class="cap">
              <div class="label">Uhr ${w.nr ?? ''} · ${esc(w.brand || '')}</div>
              <h2>${esc(w.name)}</h2>
              ${w.model ? `<div class="muted">${esc(w.model)}</div>` : ''}
              <div class="row">
                ${w.favorite ? '<span class="pill fav">Favorit</span>' : ''}
                <span class="pill">${esc(w.status || 'Sammlung')}</span>
                <span class="pill">${esc(w.category || '–')}</span>
                <span class="pill"><span class="dot" style="background:${esc(w.color || 'var(--muted)')}"></span>${esc(w.movementKind || '–')}</span>
              </div>
              ${S.canWrite ? `<div class="actions" style="margin-top:6px">
                <button class="btn" data-act="edit">Bearbeiten</button>
                ${S.assets ? `<label class="btn" for="photo-in">${w.photo ? 'Titelbild ersetzen' : 'Foto hinzufügen'}</label><input id="photo-in" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden data-photo="${esc(w.id)}">` : ''}
                ${w.status !== 'Bestellt' ? `<button class="wear-btn" data-wear-today="${esc(w.id)}" aria-pressed="${(S.wear[todayStr()] || []).includes(w.id)}">${(S.wear[todayStr()] || []).includes(w.id) ? 'Heute getragen' : 'Heute tragen'}</button>` : ''}
              </div>` : ''}
            </div>
          </section>
          ${galleryPanel(w)}
          ${measurePanel(w, ms)}
        </div>
        <div class="stack">
          ${sec('Stammdaten', f('homage', 'Vorbild') + f('dial', 'Zifferblatt') + f('hands', 'Zeiger') + f('bezel', 'Lünette')
            + f('purchased', 'Gekauft') + f('price', 'Kaufpreis', priceTxt) + f('dealer', 'Händler') + f('serial', 'Seriennummer'))}
          ${sec('Gehäuse', f('diameter', 'Durchmesser', mm('diameter')) + f('lugToLug', 'Lug-to-Lug', mm('lugToLug')) + f('height', 'Höhe', mm('height')) + f('lugWidth', 'Bandanstoß', mm('lugWidth'))
            + f('waterM', 'Wasserdicht', w.waterM ? nf(w.waterM, 0) + ' m' : null) + f('crystal', 'Glas') + f('crown', 'Krone') + f('lume', 'Leuchtmasse') + f('weight', 'Gewicht'))}
          ${sec('Werk', f('movement', 'Kaliber') + f('movementKind', 'Art') + f('bph', 'Frequenz', w.bph ? nf(w.bph, 0) + ' A/h' : null) + f('liftAngle', 'Hebungswinkel', w.liftAngle ? nf(w.liftAngle, 0) + '°' : null) + f('tol', 'Toleranz', tol))}
          ${sec('Band', f('strap', 'Aktuell') + f('strapExtra', 'Weitere'))}
          <section class="panel">
            <div class="panel-head"><h3>Offene Punkte</h3><span class="label">${todos.filter(t => !t.done).length} offen</span></div>
            ${todos.length ? todos.map((t, i) => `<label class="todo ${t.done ? 'done' : ''}"><input type="checkbox" data-todo="${i}" ${t.done ? 'checked' : ''} ${S.canWrite ? '' : 'disabled'}><span>${esc(t.t)}</span>${S.canWrite ? `<button class="btn ghost small" data-todo-del="${i}" aria-label="Punkt entfernen" style="margin-left:auto">×</button>` : ''}</label>`).join('') : '<p class="muted" style="margin:0">Nichts offen.</p>'}
            ${S.canWrite ? `<form class="todo-add" data-form="todo"><input type="text" id="todo-new" name="t" placeholder="Neuer Punkt, z. B. Lug-to-Lug nachmessen" maxlength="200"><button class="btn small">Hinzufügen</button></form>` : ''}
          </section>
          ${w.notes ? `<section class="panel"><h3>Notizen</h3><p style="margin:0;white-space:pre-wrap">${esc(w.notes)}</p></section>` : ''}
          <section class="panel"><h3>Tragetage</h3>
            <p style="margin:0">${days.length ? `${days.length} Tag${days.length > 1 ? 'e' : ''} getragen, zuerst am ${fmtDate(parseDay(days[0]))}, zuletzt am ${fmtDate(parseDay(days[days.length - 1]))}.` : 'Noch keine Tragetage eingetragen.'}</p>
            <div><button class="btn small" data-nav="tagebuch">Zum Tragetagebuch</button></div>
          </section>
          ${S.canWrite ? `<div class="actions">${S.confirm === 'del-watch' ? `<span class="muted">Uhr mit allen Messungen löschen?</span><button class="btn danger" data-act="del-watch-yes">Ja, löschen</button><button class="btn ghost" data-act="cancel-confirm">Abbrechen</button>` : `<button class="btn ghost danger" data-act="del-watch">Uhr löschen</button>`}</div>` : ''}
        </div>
      </div>`;
  }

  function galleryPanel(w) {
    const ps = photosOf(w);
    const canUp = S.canWrite && S.assets;
    if (!ps.length && !canUp) return '';
    return `<section class="panel">
      <div class="panel-head"><h3>Fotos</h3><span class="label">${ps.length} Foto${ps.length === 1 ? '' : 's'}</span></div>
      <div class="gallery">
        ${ps.map((id, i) => `<figure class="thumb">
          <button class="img" data-lb-watch="${esc(w.id)}" data-i="${i}" aria-label="Foto ${i + 1} groß ansehen"><img src="${blobUrl(id)}" alt="${esc(w.name)}, Foto ${i + 1}" loading="lazy"></button>
          ${id === w.photo ? '<span class="cover-tag">Titelbild</span>' : ''}
          ${S.canWrite ? `<div class="tools">${S.confirm === 'ph-' + id
            ? `<button class="btn small danger" data-ph-del-yes="${esc(id)}">Entfernen</button><button class="btn small ghost" data-act="cancel-confirm">Nein</button>`
            : `${id !== w.photo ? `<button class="btn small ghost" data-cover="${esc(id)}">Als Titelbild</button>` : ''}<button class="btn small ghost" data-ph-del="${esc(id)}" aria-label="Foto entfernen">×</button>`}</div>` : ''}
        </figure>`).join('')}
        ${canUp ? `<label class="add-tile" for="gal-in">+ Fotos hinzufügen</label>` : ''}
      </div>
      ${canUp ? `<input id="gal-in" type="file" multiple accept="image/png,image/jpeg,image/webp,image/gif" hidden data-gallery-add="${esc(w.id)}">` : ''}
      ${!ps.length ? '<p class="muted" style="margin:0">Noch keine Fotos. Füge Bilder vom Zifferblatt, vom Band oder vom Gehäuseboden hinzu.</p>' : ''}
    </section>`;
  }

  // ----- Galerie -----
  function renderGallery() {
    const ws = [...S.watches].sort(byNr);
    const byId = new Map();   // one tile per photo; a shared photo (the WD1965 pair) names both watches
    const push = (id, watchId, cap) => { const x = byId.get(id); if (x) { if (!x.watchIds.includes(watchId)) { x.watchIds.push(watchId); x.cap += ' und ' + cap; } } else byId.set(id, { id, watchIds: [watchId], cap }); };
    for (const w of ws) photosOf(w).forEach(id => push(id, w.id, w.name));
    for (const m of [...S.measurements].sort((a, b) => String(a.at).localeCompare(String(b.at)))) if (m.photo) push(m.photo, m.watchId, `${W(m.watchId)?.name || '?'}, Messung vom ${fmtDate(m.at)}`);
    const items = [...byId.values()];
    const shown = items.filter(x => S.galleryFilter === 'alle' || x.watchIds.includes(S.galleryFilter));
    const withPh = new Set(items.flatMap(x => x.watchIds));
    const without = ws.filter(w => !withPh.has(w.id));
    S.galleryItems = shown;
    return `
      <div class="view-head"><div><h2>Galerie</h2><p>${items.length} Fotos von ${withPh.size} Uhren. Neue Fotos fügst du auf der Seite der jeweiligen Uhr hinzu.</p></div></div>
      <div class="chips" style="margin-bottom:16px">
        <button class="chip" data-gfilter="alle" aria-pressed="${S.galleryFilter === 'alle'}">Alle</button>
        ${ws.filter(w => withPh.has(w.id)).map(w => `<button class="chip" data-gfilter="${esc(w.id)}" aria-pressed="${S.galleryFilter === w.id}"><span class="dot" style="background:${esc(w.color || 'var(--muted)')};margin-right:5px"></span>${esc(w.name)}</button>`).join('')}
      </div>
      ${shown.length ? `<div class="gallery big">${shown.map((x, i) => `<figure class="thumb">
          <button class="img" data-lb-gal="${i}" aria-label="${esc(x.cap)} groß ansehen"><img src="${blobUrl(x.id)}" alt="${esc(x.cap)}" loading="lazy"></button>
          <figcaption><a href="#uhr-${esc(x.watchIds[0])}" data-open="${esc(x.watchIds[0])}">${esc(x.cap)}</a></figcaption>
        </figure>`).join('')}</div>` : '<div class="empty">Noch keine Fotos. Öffne eine Uhr und füge dort Fotos hinzu.</div>'}
      ${without.length && S.galleryFilter === 'alle' ? `<p class="notice" style="margin-top:16px">Ohne Foto: ${without.map(w => `<a href="#uhr-${esc(w.id)}" data-open="${esc(w.id)}">${esc(w.name)}</a>`).join(', ')}.</p>` : ''}
    `;
  }

  // ----- Lightbox -----
  function openLb(list, i) { if (!list.length) return; S.lb = { list, i: Math.max(0, Math.min(i, list.length - 1)) }; renderLb(); }
  function stepLb(n) { const L = S.lb.list.length; S.lb.i = (S.lb.i + n + L) % L; renderLb(); }
  function closeLb() { const back = S.lb?.from; S.lb = null; renderLb(); back?.focus?.(); }
  function renderLb() {
    const el = document.getElementById('lb');
    if (!S.lb) { el.hidden = true; el.innerHTML = ''; document.body.style.overflow = ''; return; }
    const { list, i } = S.lb; const x = list[i]; const many = list.length > 1;
    el.hidden = false; document.body.style.overflow = 'hidden';
    el.innerHTML = `<div class="bar"><span class="cap">${esc(x.cap)}</span>${many ? `<span class="cnt">${i + 1} / ${list.length}</span>` : ''}<button data-lb-close aria-label="Schließen">×</button></div>
      <div class="stage">${many ? '<button data-lb-step="-1" aria-label="Vorheriges Foto">‹</button>' : ''}<img src="${blobUrl(x.id)}" alt="${esc(x.cap)}">${many ? '<button data-lb-step="1" aria-label="Nächstes Foto">›</button>' : ''}</div>`;
    el.querySelector('[data-lb-close]').focus();
  }

  function measurePanel(w, ms) {
    const mech = isMech(w);
    const lastW = [...ms].reverse().find(m => m.kind === 'waage');
    const unit = mech ? 's/Tag' : (w.tolUnit || 's/Tag');
    let readout = '';
    if (lastW) {
      const st = tolState(lastW.rate, w);
      const be = lastW.beatError, amp = lastW.amplitude;
      readout = `<div class="tg" role="group" aria-label="Letzte Zeitwaagen-Messung">
        <div><div class="k">Gang</div><div class="v ${st === 'ok' ? 'ok' : st ? 'warn' : ''}">${signed(lastW.rate)}</div><div class="k">s/Tag</div></div>
        <div><div class="k">Amplitude</div><div class="v ${amp >= 270 ? 'ok' : amp != null && amp < 220 ? 'warn' : ''}">${amp != null ? nf(amp, 0) + '°' : '–'}</div><div class="k">${esc(lastW.position || '')}</div></div>
        <div><div class="k">Abfallfehler</div><div class="v ${be != null && be <= 0.6 ? 'ok' : be != null ? 'warn' : ''}">${be != null ? nf(be, 1) : '–'}</div><div class="k">ms</div></div>
      </div><p class="muted" style="margin:0;font-size:13px">Letzte Messung am ${fmtDT(lastW.at)}${lastW.bph ? ` bei ${nf(lastW.bph, 0)} A/h` : ''}.</p>`;
    }
    return `<section class="panel">
      <div class="panel-head"><h3>Messungen</h3>${S.canWrite ? `<button class="btn small" data-act="add-m" data-w="${esc(w.id)}">+ Messung</button>` : ''}</div>
      ${S.mEditing && S.mEditing.watchId === w.id ? measureForm(S.mEditing) : ''}
      ${readout}
      ${ms.length >= 1 ? `<div class="chart">${rateChart(ms, w)}</div>` : `<p class="muted" style="margin:0">${mech ? 'Noch keine Zeitwaagen-Messung. Trage Gang, Amplitude und Abfallfehler ein.' : 'Quarzwerke misst du über einige Wochen gegen eine Funkuhr: Abweichung in Sekunden und Zeitraum in Tagen eintragen.'}</p>`}
      ${ms.length ? measureTable(ms, false, 3) : ''}
      ${w.tolMin != null ? `<p class="muted" style="margin:0;font-size:12.5px">Grünes Band: Werkstoleranz ${signed(w.tolMin, 0)} bis ${signed(w.tolMax, 0)} ${esc(unit)}.</p>` : ''}
    </section>`;
  }

  function rateChart(ms, w) {
    const pts = ms.map(m => ({ m, v: mValue(m, w), t: new Date(m.at).getTime() })).filter(p => p.v != null && !isNaN(p.t));
    if (!pts.length) return '';
    const unit = pts[0].m.kind === 'waage' ? 's/Tag' : (w.tolUnit || 's/Tag');
    const Wd = 600, H = 210, L = 46, R = 18, T = 18, B = 30;
    let lo = Math.min(...pts.map(p => p.v), 0), hi = Math.max(...pts.map(p => p.v), 0);
    if (w.tolMin != null) { lo = Math.min(lo, w.tolMin); hi = Math.max(hi, w.tolMax); }
    const span = hi - lo || 10; lo -= span * 0.12; hi += span * 0.12;
    const step = niceStep((hi - lo) / 4);
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const t0 = Math.min(...pts.map(p => p.t)), t1 = Math.max(...pts.map(p => p.t));
    const x = t => t1 === t0 ? (L + (Wd - L - R) / 2) : L + (t - t0) / (t1 - t0) * (Wd - L - R);
    const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
    let g = '';
    for (let v = lo; v <= hi + 1e-9; v += step) g += `<line class="grid-line" x1="${L}" x2="${Wd - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${signed(Math.round(v * 10) / 10, 1).replace('±0', '0')}</text>`;
    const band = w.tolMin != null ? `<rect class="band" x="${L}" width="${Wd - L - R}" y="${y(w.tolMax)}" height="${y(w.tolMin) - y(w.tolMax)}"/><line class="band-edge" x1="${L}" x2="${Wd - R}" y1="${y(w.tolMax)}" y2="${y(w.tolMax)}"/><line class="band-edge" x1="${L}" x2="${Wd - R}" y1="${y(w.tolMin)}" y2="${y(w.tolMin)}"/>` : '';
    const zero = `<line class="zero" x1="${L}" x2="${Wd - R}" y1="${y(0)}" y2="${y(0)}"/>`;
    const path = pts.length > 1 ? `<path class="line" d="${pts.map((p, i) => (i ? 'L' : 'M') + x(p.t).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ')}"/>` : '';
    const dots = pts.map((p, i) => `<circle class="pt ${i === pts.length - 1 ? 'last' : ''}" cx="${x(p.t)}" cy="${y(p.v)}" r="${i === pts.length - 1 ? 5 : 4}"><title>${fmtDT(p.m.at)}: ${signed(p.v)} ${unit}</title></circle>`).join('');
    const lp = pts[pts.length - 1];
    const lab = `<text class="val" x="${Math.min(x(lp.t) + 9, Wd - R - 4)}" y="${y(lp.v) - 9}" text-anchor="${x(lp.t) > Wd - 90 ? 'end' : 'start'}">${signed(lp.v)} ${unit}</text>`;
    const xl = `<text class="axis" x="${pts.length > 1 ? L : x(t0)}" y="${H - 8}" text-anchor="${pts.length > 1 ? 'start' : 'middle'}">${fmtDate(new Date(t0))}</text>${pts.length > 1 ? `<text class="axis" x="${Wd - R}" y="${H - 8}" text-anchor="end">${fmtDate(new Date(t1))}</text>` : ''}`;
    return `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Gangverlauf in ${unit}">${g}${band}${zero}${path}${dots}${lab}${xl}</svg>`;
  }
  function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }

  // max: nur die neuesten zeigen (Detailseite), mit Knopf zum Aufklappen
  function measureTable(ms, withWatch, max = 0) {
    const alle = [...ms].sort((a, b) => String(b.at).localeCompare(String(a.at)));
    const offen = !max || S.msAlle === ms[0]?.watchId, rows = offen ? alle : alle.slice(0, max);
    const mehr = max && alle.length > max ? `<button class="btn small ghost" data-act="ms-alle" data-w="${esc(ms[0].watchId)}" style="margin-top:6px">${offen ? 'Nur die letzten ' + max + ' zeigen' : `Alle Messungen (${alle.length})`}</button>` : '';
    return `<div class="tbl-wrap"><table>
      <thead><tr><th>Datum</th>${withWatch ? '<th>Uhr</th>' : ''}<th>Lage / Zeitraum</th><th class="num">Gang</th><th class="num">Amplitude</th><th class="num">Abfallfehler</th><th>Notiz</th>${S.canWrite ? '<th></th>' : ''}</tr></thead>
      <tbody>${rows.map(m => {
        const w = W(m.watchId); const v = mValue(m, w); const st = tolState(v, w);
        const del = S.confirm === 'm-' + m.id;
        return `<tr>
          <td class="mono" style="white-space:nowrap">${fmtDT(m.at)}</td>
          ${withWatch ? `<td><a href="#uhr-${esc(m.watchId)}" data-open="${esc(m.watchId)}"><span class="dot" style="background:${esc(w?.color || 'var(--muted)')};margin-right:6px"></span>${esc(w?.name || '?')}</a></td>` : ''}
          <td>${m.kind === 'waage' ? esc(m.position || '–') + (m.method === 'mikro' ? ' <span title="per Mikrofon gemessen">🎙</span>' : '') : `${nf(m.days, 1) ?? '–'} Tage, ${signed(m.deviation)} s`}</td>
          <td class="num mono state-${st}">${v != null ? signed(v) + ' ' + esc(unitOf(m, w)) : '–'}</td>
          <td class="num mono">${m.amplitude != null ? nf(m.amplitude, 0) + '°' : '–'}</td>
          <td class="num mono">${m.beatError != null ? nf(m.beatError, 1) + ' ms' : '–'}</td>
          <td>${esc(m.note || '')}${m.photo ? ` <a href="${blobUrl(m.photo)}" target="_blank" rel="noopener">Foto</a>` : ''}</td>
          ${S.canWrite ? `<td style="white-space:nowrap">${del ? `<button class="btn small danger" data-m-del-yes="${esc(m.id)}">Löschen</button> <button class="btn small ghost" data-act="cancel-confirm">Nein</button>` : `<button class="btn small ghost" data-m-edit="${esc(m.id)}">Ändern</button><button class="btn small ghost" data-m-del="${esc(m.id)}" aria-label="Messung löschen">×</button>`}</td>` : ''}
        </tr>`;
      }).join('')}</tbody></table></div>${mehr}`;
  }

  function measureForm(m) {
    const w = W(m.watchId);
    const kind = m.kind || (isMech(w) ? 'waage' : 'vergleich');
    const sel = (v, o) => v === o ? 'selected' : '';
    const positions = POSITIONS;
    return `<form class="grid-form" data-form="measure" style="background:var(--sunk);padding:12px;border-radius:8px">
      ${kind === 'waage' && isQuarzWerk(w) ? `<div class="field wide"><p class="notice" style="margin:0">Quarzuhr: Den Gang misst du genauer mit „Abgleich mit Funkuhr“ über einige Wochen als mit der Zeitwaage. <button type="button" class="btn small" data-act="m-to-vergleich">Zum Abgleich wechseln</button></p></div>`
      : kind === 'waage' ? `<div class="field wide"><button type="button" class="btn mic-btn" data-act="zw-open">🎙 ${esc(w?.name || 'Uhr')} mit dem Mikrofon messen</button>${m.method === 'mikro' ? `<span class="muted" style="font-size:12.5px">Per Mikrofon gemessen${m.dur ? `, ${m.dur} s` : ''}${m.quality != null ? `, Güte ${nf(m.quality * 100, 0)} %` : ''}${m.calibPpm ? '' : ', Handy-Takt nicht kalibriert'}</span>` : ''}</div>` : ''}
      <div class="field"><label for="m-watch">Uhr</label><select id="m-watch" name="watchId">${[...S.watches].sort(byNr).map(x => `<option value="${esc(x.id)}" ${sel(x.id, m.watchId)}>${x.nr ?? ''} · ${esc(x.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="m-kind">Art</label><select id="m-kind" name="kind"><option value="waage" ${sel(kind, 'waage')}>Zeitwaage</option><option value="vergleich" ${sel(kind, 'vergleich')}>Abgleich mit Funkuhr</option></select></div>
      <div class="field"><label for="m-at">Zeitpunkt</label><input id="m-at" type="datetime-local" name="at" value="${esc((m.at || new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString()).slice(0, 16))}" required></div>
      ${kind === 'waage' ? `
        <div class="field"><label for="m-pos">Lage</label><select id="m-pos" name="position">${positions.map(p => `<option ${sel(p, m.position || 'Zifferblatt oben')}>${p}</option>`).join('')}</select></div>
        <div class="field"><label for="m-rate">Gang (s/Tag)</label><input id="m-rate" type="number" step="0.1" name="rate" value="${m.rate ?? ''}" placeholder="+15" required></div>
        <div class="field"><label for="m-amp">Amplitude (°)</label><input id="m-amp" type="number" step="1" name="amplitude" value="${m.amplitude ?? ''}" placeholder="270"></div>
        <div class="field"><label for="m-be">Abfallfehler (ms)</label><input id="m-be" type="number" step="0.01" min="0" name="beatError" value="${m.beatError ?? ''}" placeholder="0,4"></div>
        <div class="field"><label for="m-bph">Frequenz (A/h)</label><input id="m-bph" type="number" step="1" name="bph" value="${m.bph ?? w?.bph ?? ''}"></div>`
      : `
        <div class="field"><label for="m-dev">Abweichung (s)</label><input id="m-dev" type="number" step="0.1" name="deviation" value="${m.deviation ?? ''}" placeholder="+4" required></div>
        <div class="field"><label for="m-days">Zeitraum (Tage)</label><input id="m-days" type="number" step="0.1" min="0.1" name="days" value="${m.days ?? ''}" placeholder="14" required></div>`}
      <div class="field wide"><label for="m-note">Notiz</label><input id="m-note" type="text" name="note" value="${esc(m.note || '')}" placeholder="z. B. voll aufgezogen, nach 24 h Ablauf"></div>
      <div class="actions field wide"><button class="btn primary">${m.id ? 'Messung speichern' : 'Messung eintragen'}</button><button type="button" class="btn ghost" data-act="cancel-m">Abbrechen</button></div>
    </form>`;
  }

  // ----- Messungen -----
  function renderMeasurements() {
    const ws = [...S.watches].sort(byNr);
    const ms = S.measurements.filter(m => S.mFilter === 'alle' || m.watchId === S.mFilter);
    const w = S.mFilter !== 'alle' ? W(S.mFilter) : null;
    const measured = new Set(S.measurements.map(m => m.watchId));
    const missing = ws.filter(x => isMech(x) && x.status !== 'Bestellt' && !measured.has(x.id));
    return `
      <div class="view-head">
        <div><h2>Messungen</h2><p>Zeitwaage für mechanische Werke, Abgleich mit der Funkuhr für Quarz.</p></div>
        ${S.canWrite ? `<button class="btn primary" data-act="add-m" data-w="${esc(S.mFilter !== 'alle' ? S.mFilter : (ws.find(isMech)?.id || ws[0]?.id || ''))}">+ Messung</button>` : ''}
      </div>
      ${S.mEditing && S.view === 'messungen' ? `<section class="panel" style="margin-bottom:16px">${measureForm(S.mEditing)}</section>` : ''}
      <div class="chips" style="margin-bottom:16px">
        <button class="chip" data-mfilter="alle" aria-pressed="${S.mFilter === 'alle'}">Alle Uhren</button>
        ${ws.map(x => `<button class="chip" data-mfilter="${esc(x.id)}" aria-pressed="${S.mFilter === x.id}">${esc(x.name)}${measured.has(x.id) ? '' : ' ·'}</button>`).join('')}
      </div>
      ${w && ms.length ? `<section class="panel" style="margin-bottom:16px"><div class="panel-head"><h3>Gangverlauf ${esc(w.name)}</h3>${w.tolMin != null ? `<span class="label">Toleranz ${signed(w.tolMin, 0)} bis ${signed(w.tolMax, 0)} ${esc(w.tolUnit || 's/Tag')}</span>` : ''}</div><div class="chart">${rateChart(ms.filter(m => m.watchId === w.id).sort((a, b) => String(a.at).localeCompare(String(b.at))), w)}</div></section>` : ''}
      ${ms.length ? measureTable(ms, S.mFilter === 'alle') : `<div class="empty">${w ? `Für die ${esc(w.name)} gibt es noch keine Messung.` : 'Noch keine Messungen eingetragen.'}</div>`}
      ${missing.length && S.mFilter === 'alle' ? `<p class="notice" style="margin-top:16px">Noch nicht mit der Zeitwaage gemessen: ${missing.map(x => esc(x.name)).join(', ')}.</p>` : ''}
    `;
  }

  // ----- Tragetagebuch -----
  function renderDiary() {
    const ws = [...S.watches].filter(w => w.status !== 'Bestellt' && w.status !== 'Verkauft').sort(byNr);
    const sel = S.diaryDate; const selW = S.wear[sel] || [];
    const today = parseDay(todayStr());
    // calendar: 18 weeks ending this week, Monday first
    const weeks = 18;
    const start = new Date(today); start.setDate(start.getDate() - ((start.getDay() + 6) % 7) - (weeks - 1) * 7);
    let cells = '', lastMonth = -1;
    for (let wk = 0; wk < weeks; wk++) {
      const first = new Date(start); first.setDate(first.getDate() + wk * 7);
      const mon = first.getMonth();
      cells += `<div class="m">${mon !== lastMonth ? first.toLocaleDateString('de-DE', { month: 'short' }) : ''}</div>`; lastMonth = mon;
      for (let d = 0; d < 7; d++) {
        const day = new Date(first); day.setDate(day.getDate() + d);
        const ds = todayStr(day); const ids = S.wear[ds] || [];
        const cols = ids.map(id => W(id)?.color || 'var(--muted)');
        const bg = cols.length === 0 ? '' : cols.length === 1 ? `background:${esc(cols[0])}` : `background:linear-gradient(135deg, ${esc(cols[0])} 50%, ${esc(cols[1])} 50%)`;
        const fut = day > today;
        cells += `<button class="d ${ds === todayStr() ? 'today' : ''} ${ds === sel ? 'sel' : ''} ${fut ? 'future' : ''} ${ids.some(id => S.wearShots[ds]?.[id]) ? 'shot' : ''}" style="${bg}" ${fut ? 'disabled' : `data-day="${ds}"`} title="${day.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' })}${ids.length ? ': ' + esc(ids.map(id => W(id)?.name || '?').join(', ')) : ''}" aria-label="${ds}${ids.length ? ', ' + esc(ids.map(id => W(id)?.name || '?').join(', ')) : ''}"></button>`;
      }
    }
    const range = S.statRange; const cutoff = range === 'alle' ? null : new Date(today.getTime() - Number(range) * 864e5);
    const counts = {}; let totalDays = 0;
    for (const [d, ids] of Object.entries(S.wear)) { if (cutoff && parseDay(d) <= cutoff) continue; if (ids.length) totalDays++; ids.forEach(id => counts[id] = (counts[id] || 0) + 1); }
    const max = Math.max(1, ...Object.values(counts));
    const ranked = ws.map(w => ({ w, n: counts[w.id] || 0 })).sort((a, b) => b.n - a.n || byNr(a.w, b.w));
    const neglected = ranked.filter(r => r.n === 0).map(r => r.w);
    const selDate = parseDay(sel);
    const selShots = selW.filter(id => S.wearShots[sel]?.[id]);
    return `
      <div class="view-head"><div><h2>Tragetagebuch</h2><p>Halte fest, welche Uhr du wann getragen hast.</p></div></div>
      <div class="diary">
        <div class="stack">
          <section class="panel">
            <div class="panel-head"><h3>${sel === todayStr() ? 'Heute' : selDate.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' })}</h3>
              <div class="actions"><input type="date" id="diary-date" value="${sel}" max="${todayStr()}" aria-label="Tag wählen" style="width:auto">${sel !== todayStr() ? '<button class="btn small" data-act="diary-today">Heute</button>' : S.canWrite && ws.length ? '<button class="btn small" data-act="wristcheck">📷 Was trage ich?</button>' : ''}</div></div>
            ${ws.length ? `<div class="pick">${ws.map(w => `<button data-wear="${esc(w.id)}" aria-pressed="${selW.includes(w.id)}" ${S.canWrite ? '' : 'disabled'}><span class="dot" style="background:${esc(w.color || 'var(--muted)')};width:14px;height:14px"></span>${esc(w.name)}</button>`).join('')}</div>` : '<p class="muted">Noch keine Uhren in der Sammlung.</p>'}
            <p class="muted" style="margin:0;font-size:13px">${selW.length ? `Getragen: ${selW.map(id => esc(W(id)?.name || '?')).join(' und ')}. Tippe erneut, um es zu entfernen.` : 'Tippe auf eine Uhr, um sie für diesen Tag einzutragen. Ein Uhrwechsel am Tag geht auch.'}</p>
            ${selShots.length ? `<div class="day-shots">${selShots.map((id, i) => `<button data-shot="${i}" aria-label="Foto mit ${esc(W(id)?.name || '?')} groß ansehen"><img src="${blobUrl(S.wearShots[sel][id])}" alt="${esc(W(id)?.name || '?')} am Handgelenk"></button>`).join('')}</div>` : ''}
          </section>
          <section class="panel">
            <div class="panel-head"><h3>Die letzten ${weeks} Wochen</h3><span class="label">${Object.values(S.wear).filter(a => a.length).length} Tage eingetragen</span></div>
            <div class="cal-row"><div class="wd-labels"><span></span><span>Mo</span><span></span><span>Mi</span><span></span><span>Fr</span><span></span><span>So</span></div>
            <div class="cal-wrap"><div class="cal">${cells}</div></div></div>
            <p class="muted" style="margin:0;font-size:12.5px">Jedes Feld ist ein Tag in der Farbe der getragenen Uhr. Tippe auf einen Tag, um ihn oben zu bearbeiten.</p>
          </section>
        </div>
        <section class="panel">
          <div class="panel-head"><h3>Rotation</h3>
            <div class="chips">${[['30', '30 Tage'], ['90', '90 Tage'], ['alle', 'Gesamt']].map(([k, l]) => `<button class="chip" data-range="${k}" aria-pressed="${range === k}">${l}</button>`).join('')}</div></div>
          ${totalDays ? `<div class="bars">${ranked.map(r => `<div class="bar-row"><span class="nm" title="${esc(watchLabel(r.w))}">${esc(r.w.name)}</span><div class="track"><div class="fill" style="width:${r.n / max * 100}%;background:${esc(r.w.color || 'var(--muted)')}"></div></div><span class="n">${r.n}</span></div>`).join('')}</div>
            <p class="muted" style="margin:0;font-size:13px">${totalDays} Tragetage im Zeitraum.${neglected.length ? ` Länger nicht am Arm: ${neglected.map(w => esc(w.name)).join(', ')}.` : ' Jede Uhr kam dran.'}</p>`
            : `<div class="empty" style="padding:18px">Noch keine Tragetage in diesem Zeitraum. Trag links ein, welche Uhr du heute trägst.</div>`}
        </section>
      </div>`;
  }

  // ----- Wristcheck Light: Foto → Uhr antippen → Tragetag (ohne KI) -----
  // Regeln liefern eine sortierte Liste { w, score, why }. Eine spätere lokale Erkennung (Premium) sortiert sie in wcReorder nur um.
  function wristSuggestions(day = todayStr()) {
    const d0 = parseDay(day); const wdName = d0.toLocaleDateString('de-DE', { weekday: 'long' });
    const ago = s => Math.round((d0 - parseDay(s)) / 864e5);
    return S.watches.filter(w => w.status !== 'Bestellt' && w.status !== 'Verkauft').map(w => {
      const past = wearDaysOf(w.id).filter(s => s < day);
      const last = past.length ? ago(past[past.length - 1]) : null;
      const sameWd = past.filter(s => ago(s) <= 56 && ago(s) % 7 === 0).length;   // gleicher Wochentag, letzte 8 Wochen
      let score = 0; const why = [];
      if ((S.wear[day] || []).includes(w.id)) { score += 100; why.push('heute schon eingetragen'); }
      if (last === 1) { score += 5; why.push('gestern getragen'); }
      else if (last != null && last <= 3) { score += 2; why.push(last === 2 ? 'vorgestern getragen' : 'vor 3 Tagen getragen'); }
      if (sameWd) { score += 1.5 * sameWd; why.push(sameWd > 1 ? `${sameWd}× an ${wdName}en getragen` : `an einem ${wdName} getragen`); }
      // „mal wieder“: kleiner Bonus, der mit der Pause wächst, damit vergessene Uhren auftauchen, wenn sonst nichts passt
      const gap = last ?? 60;
      if (gap >= 7) { score += Math.min(gap, 60) / 60; if (!why.length) why.push(last == null ? 'noch nicht getragen' : `seit ${last} Tagen nicht am Arm`); }
      return { w, score, why: why.join(' · ') };
    }).sort((a, b) => b.score - a.score || byNr(a.w, b.w));
  }
  const wcReorder = async (list, blob) => list;   // Premium später: Wiedererkennung vergleicht das Foto und sortiert um

  function openWc(camera) {
    S.wc = { blob: null, url: null, list: wristSuggestions(), busy: false };
    renderWc();
    if (camera) document.getElementById('wc-cam').click();   // noch im Tipp, sonst blockt der Browser die Kamera
  }
  function closeWc() { if (S.wc?.url) URL.revokeObjectURL(S.wc.url); S.wc = null; renderWc(); }
  async function wcPhoto(file) {
    if (!file) return;
    if (!S.wc) openWc(false);
    if (S.wc.url) URL.revokeObjectURL(S.wc.url);
    Object.assign(S.wc, { blob: file, url: URL.createObjectURL(file) });
    S.wc.list = await wcReorder(wristSuggestions(), file);
    renderWc();
  }
  async function wcPick(id) {
    const day = todayStr(); const { blob } = S.wc; const w = W(id);
    S.wc.busy = true; renderWc();
    try {
      const shots = { ...(S.wearShots[day] || {}) }; const old = shots[id];
      if (blob) shots[id] = (await S.assets.upload(blob)).id;
      await S.db.collection('wear').doc(day).set({ date: day, watches: uniq([...(S.wear[day] || []), id]), ...(Object.keys(shots).length ? { shots } : {}) });
      if (blob && old && !photoInUse(old)) { try { await S.assets.delete(old); } catch (er) { console.error(er); } }
      closeWc(); S.diaryDate = day; render();
      toast(`${w.name} für heute eingetragen${blob ? ', mit Foto' : ''}`);
    } catch (er) {
      if (S.wc) { S.wc.busy = false; renderWc(); }
      if (er?.code === 'unsupported_type') toast(photoErr(er)); else fail(er, 'Eintragen');
    }
  }
  function renderWc() {
    const el = document.getElementById('wc');
    if (!S.wc) { el.hidden = true; el.innerHTML = ''; if (!S.lb) document.body.style.overflow = ''; return; }
    const { blob, url, list, busy } = S.wc;
    // Vorschlag = die ersten drei mit einem echten Grund aus dem Tragemuster (nicht nur „lange nicht getragen“)
    const top = new Set(list.slice(0, 3).filter(r => r.score >= 1.5).map(r => r.w.id));
    const item = r => `<button data-wc-pick="${esc(r.w.id)}" class="${top.has(r.w.id) ? 'top' : ''}" ${busy ? 'disabled' : ''}>${top.has(r.w.id) ? '<span class="tag">Vorschlag</span>' : ''}<span class="ph">${photoHtml(r.w)}</span><span class="nm">${esc(r.w.name)}</span>${r.why ? `<span class="why">${esc(r.why)}</span>` : ''}</button>`;
    el.hidden = false; document.body.style.overflow = 'hidden';
    el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="wc-h">
      <div class="panel-head"><h3 id="wc-h">Was trage ich?</h3><button class="btn ghost small" data-act="wc-close" aria-label="Schließen">×</button></div>
      ${blob ? `<div class="shot"><img src="${url}" alt="Dein Foto von heute"></div>` : '<p class="notice" style="margin:0">Mach ein Foto vom Handgelenk und tippe dann die Uhr an. Ohne Foto geht es auch.</p>'}
